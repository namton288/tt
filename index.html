<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal &amp; IR Q&amp;A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered instrument column; an ironbow span bar is the single bold element (progress + score). */
:root{
  --bg:#e9edf1; --surface:#fafbfc; --sunk:#dfe5eb; --ink:#141a21; --muted:#56616d; --line:#c9d1d9;
  --hot:#d9501a; --hot-ink:#ffffff; --cold:#3b2c86;
  --good:#1d7f52; --good-bg:#dcefe5; --bad:#b8322a; --bad-bg:#f6e0dd;
  --iron:linear-gradient(90deg,#08031a 0%,#2b0b5a 14%,#6a0f78 28%,#b0215f 42%,#e2462b 56%,#f47c12 70%,#fbbd2c 84%,#fff3b8 100%);
  --f-display:"Chakra Petch","Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#161b21; --sunk:#1d242c; --ink:#e6eaef; --muted:#93a0ad; --line:#2b333d;
  --hot:#ff7436; --hot-ink:#1a0d05; --cold:#a99bff;
  --good:#4fc78d; --good-bg:#14302a; --bad:#ff7a6e; --bad-bg:#3a1c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#161b21; --sunk:#1d242c; --ink:#e6eaef; --muted:#93a0ad; --line:#2b333d;
  --hot:#ff7436; --hot-ink:#1a0d05; --cold:#a99bff;
  --good:#4fc78d; --good-bg:#14302a; --bad:#ff7a6e; --bad-bg:#3a1c1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05}
h2{font-size:20px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip input:focus-visible+span,summary:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

/* ironbow strip */
.iron{height:10px;border-radius:2px;background:var(--iron);position:relative}
.scale{display:flex;justify-content:space-between;font:500 11px/1 var(--f-mono);color:var(--muted);margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px}
.hero{display:grid;gap:12px}
.hero p{margin:0;max-width:62ch;color:var(--muted)}

fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
fieldset:disabled{opacity:.45}
fieldset:disabled .chip input{cursor:not-allowed}
legend{font:600 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:0;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-weight:500;font-size:14px;user-select:none}
.chip span b{font:500 12px/1 var(--f-mono);color:var(--muted);font-weight:500}
.chip input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip input:checked+span b{color:inherit;opacity:.7}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.pool{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.pool .n{font:600 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:4px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.refs{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.refs b{font-family:var(--f-mono);color:var(--ink);display:inline-block;width:1.6em}

/* quiz */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvl{font:700 12px/1 var(--f-display);letter-spacing:.1em;padding:5px 8px;border-radius:3px;background:var(--ink);color:var(--surface)}
.track{position:relative;height:14px;border-radius:2px;background:var(--sunk);overflow:hidden}
.track .fill{position:absolute;inset:0;background:var(--iron);clip-path:inset(0 100% 0 0);transition:clip-path .35s ease}
.track .ticks{position:absolute;inset:0;display:flex}
.track .ticks i{flex:1;border-right:1px solid color-mix(in srgb,var(--bg) 70%,transparent)}
.track .ticks i:last-child{border-right:0}
.track .ticks i.miss{background:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--bg) 75%,transparent) 3px 5px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.qtext{font-size:18px;line-height:1.5;margin:0;font-weight:500;max-width:65ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.opt .k{font:600 13px/1 var(--f-mono);display:grid;place-items:center;width:28px;height:28px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.opt span:last-child{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.explain{border-left:3px solid var(--good);padding:4px 0 4px 14px;display:grid;gap:6px}
.explain.wrong{border-left-color:var(--bad)}
.explain h3{font-size:15px}
.explain p{margin:0;max-width:65ch}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font:500 12px/1.3 var(--f-mono);color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:420px;width:100%;display:grid;gap:14px}
.modal p{margin:0}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.score .big{font:700 clamp(56px,14vw,84px)/.9 var(--f-display);font-variant-numeric:tabular-nums}
.score .big small{font-size:.4em;margin-left:2px}
.verdict{display:inline-block;font:700 12px/1 var(--f-display);letter-spacing:.12em;padding:6px 9px;border-radius:3px}
.verdict.pass{background:var(--good-bg);color:var(--good)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.gauge{position:relative;margin-top:10px}
.gauge .needle{position:absolute;top:-5px;width:2px;height:20px;background:var(--ink)}
.gauge .mark{position:absolute;top:-4px;height:18px;border-left:1px dashed var(--ink);opacity:.55}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,180px) 1fr 70px;gap:12px;align-items:center;font-size:14px}
.row .t{height:8px;background:var(--sunk);border-radius:2px;overflow:hidden}
.row .t i{display:block;height:100%;background:var(--hot)}
.row .v{text-align:right;font:500 13px/1 var(--f-mono)}
.review{display:grid;gap:0}
.rv{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px}
.rv:first-child{border-top:0}
.rv .q{margin:0;font-weight:500}
.rv .a{font-size:14px;display:grid;gap:3px}
.rv .a .y{color:var(--bad)}
.rv .a .c{color:var(--good)}
.rv .x{font-size:14px;color:var(--muted);margin:0}
.tag{font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:3px 6px;border-radius:3px}
.tag.ok{background:var(--good-bg);color:var(--good)}
.tag.no{background:var(--bad-bg);color:var(--bad)}
.tag.skip{background:var(--sunk);color:var(--muted)}
.meta .rep{color:var(--hot);font-weight:600}
.meta .sim{color:var(--cold)}
.foot{font-size:12.5px;color:var(--muted);max-width:65ch}
@media (max-width:480px){.qtext{font-size:16.5px}.score{grid-template-columns:1fr}.row{grid-template-columns:1fr 54px}.row .t{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ASNT SNT-TC-1A Q&A Book J — Thermal & Infrared Testing Method (2010), plus the ASNT Level III Study Guide (Kaplan, 2001) chapter reviews.
// l=level, n=question number, t=topic, a=answer index (0=a), s=source ("SG" = study guide; Book J entries have no s), ch=study guide chapter
const Q = [
// ───────── LEVEL I ─────────
{l:1,n:1,t:"HT",q:"One calorie is equivalent to how much heat energy?",o:["raising the temperature of 1 lb of water 1 °F","raising the temperature of 1 g of water 1 °C","raising the temperature of 1 lb of water 1 °C","raising the temperature of 1 g of water 1 °F"],a:1,r:"A.26",x:"The calorie is the heat needed to raise 1 g of water by 1 °C (about 4.186 J). Raising 1 lb of water by 1 °F is the definition of the BTU."},
{l:1,n:2,t:"HT",q:"Which of the following is incorrect?",o:["0 °C = 32 °F","−40 °C = −40 °F","°C = 32 + (9/5 × °F)","100 °C = 212 °F"],a:2,r:"A.27",x:"The correct relation is °F = 32 + (9/5 × °C). Option c swaps the two scales, so it is the incorrect statement."},
{l:1,n:3,t:"HT",q:"Newton’s Law of convective cooling states that:",o:["the rate of heat loss is proportional to the heat capacity of the body and its surface area","the rate of cooling is inversely proportional to the temperature","the rate of heat loss is inversely proportional to the temperature of the body","the rate of heat loss of a body is proportional to the difference in temperature between the body and its fluid surroundings"],a:3,r:"A.54",x:"Newton’s law of cooling: q = hA(Ts − T∞). Convective heat loss scales with the surface-to-fluid temperature difference."},
{l:1,n:4,t:"HT",q:"The second law of thermodynamics states:",o:["energy moving into a body equals the energy leaving a body if it is at steady state","energy moves from areas of high temperature to areas of low temperature","energy moves from cooler areas to warmer areas","energy moving out of a body equals the energy transmitting through the body"],a:1,r:"D.355",x:"Heat flows spontaneously from hot to cold. Option a is a statement of the first law at steady state."},
{l:1,n:5,t:"HT",q:"The first law of thermodynamics states:",o:["when energy moving into a body plus any internal energy generated equals the energy leaving a body, that body is in a steady state condition","energy moves from areas of high temperature to areas of low temperature","energy moves from cooler areas to warmer areas","energy moving out of a body equals the energy transmitting through the body"],a:0,r:"B.13",x:"The first law is conservation of energy: E_in + E_generated − E_out = ΔE_stored. With no change in stored energy the body is at steady state."},
{l:1,n:6,t:"HT",q:"Which of the following temperature scales is considered an absolute scale?",o:["Fahrenheit","Boltzmann","Celsius","kelvin"],a:3,r:"D.356",x:"Kelvin (and Rankine) start at absolute zero. There is no Boltzmann temperature scale."},
{l:1,n:7,t:"HT",q:"Which of the following temperature scales is considered to be a relative scale?",o:["Rankine","Boltzmann","Celsius","kelvin"],a:2,r:"D.356",x:"Celsius and Fahrenheit are relative scales referenced to the freezing and boiling points of water, not to absolute zero."},
{l:1,n:8,t:"HT",q:"For every degree on the Celsius temperature scale how many degrees are on the Fahrenheit scale?",o:["5/9 − 32","1.8","32","100"],a:1,r:"D.356",x:"A temperature difference of 1 °C equals 1.8 °F (9/5). The 32 offset applies only to absolute readings, not to differences."},
{l:1,n:9,t:"HT",q:"The material property that relates to the rate that heat flows through a solid material is called:",o:["thermal conductivity","convective efficiency","conductive efficiency","emissive conductivity"],a:0,r:"B.4",x:"Thermal conductivity k (W/m·K) appears in Fourier’s law, q = −kA dT/dx."},
{l:1,n:10,t:"RAD",q:"A micron is a unit of:",o:["length","wave amplitude","temperature","roughness"],a:0,r:"A.33",x:"The micron (µm) is a length unit, used in thermography to express wavelength."},
{l:1,n:11,t:"RAD",q:"A micron is a unit of measure that is:",o:["one thousandth of a meter","one thousand thousandth of an inch","one millionth of a meter","one millionth of an inch"],a:2,r:"A.33",x:"1 µm = 10⁻⁶ m. Thermal IR spans roughly 0.75 µm to 1000 µm; imagers work mostly at 3–5 µm and 8–14 µm."},
{l:1,n:12,t:"RAD",q:"Which material below is transmissive to long wave (8–14 µm) infrared radiation?",o:["polyethylene film","glass","rubber","human skin"],a:0,r:"A.292",x:"Thin polyethylene transmits most long-wave IR outside its narrow absorption bands. Glass is opaque beyond about 4.5 µm; rubber and skin are opaque emitters."},
{l:1,n:13,t:"APP",q:"You are inspecting an energized 440 V electrical three-phase fused disconnect. The fuse caps on the fuses are copper and appear cooler than the fuse cardboard bodies. What is probably the reason?",o:["the fuse caps are emitting the coolness inside themselves","the fuse caps are radiating less energy and reflecting the cooler room temperatures","the fuse bodies are actually warmer than the fuse caps","the fuse bodies are reflecting your body’s warmth"],a:1,r:"A.36",x:"Bare copper has low emissivity, so it emits little and mostly reflects the cooler surroundings. It looks cooler even though it may be as hot as, or hotter than, the high-emissivity cardboard."},
{l:1,n:14,t:"RAD",q:"Emittance of a surface may vary with which of the following?",o:["thermal conductance","angle of view","thermal resistance","coefficient of convective heat transfer"],a:1,r:"A.298",x:"Emissivity depends on viewing angle, wavelength, temperature and surface condition. It falls off at grazing angles."},
{l:1,n:15,t:"APP",q:"A low sloped roof is inspected in the early evening after a sunny day. Wet absorbent roof insulation appears warmer than the dry insulation because:",o:["the wet insulation is a better emitter of thermal radiation","the wet insulation is more reflective than the dry insulation","the dry insulation cools off slower than the wet insulation","the wet insulation cools off slower than the dry insulation"],a:3,r:"A.57",x:"Water’s high heat capacity stores solar heat during the day. After sundown, wet areas give it up slowly and stay warmer than dry areas."},
{l:1,n:16,t:"RAD",q:"Which of the following equations is used to calculate the amount of radiant energy emitted from a surface?",o:["R + A + T = 1","Q = σεT⁴","λm = b/T absolute","E = mc²"],a:1,r:"A.38; D.9",x:"Stefan–Boltzmann law: W = εσT⁴ with T in kelvin. Option a is Kirchhoff’s energy balance and option c is Wien’s displacement law."},
{l:1,n:17,t:"EQ",q:"Which of the following IR camera settings may affect a radiometric temperature measurement?",o:["span","level","palette","focus"],a:3,r:"C.12-61",x:"Span, level and palette only change how the data is displayed. Poor focus blurs a small target with its background and changes the measured value."},
{l:1,n:18,t:"EQ",q:"Which of the following camera parameters is not adjustable in post-processing computer software?",o:["span","level","emissivity","range"],a:3,r:"C.12-61",x:"The temperature range (calibration range and filter) is fixed when the image is captured. Span, level and emissivity can be changed later in software for radiometric images."},
{l:1,n:19,t:"RAD",q:"A thick ceramic coffee mug has an emissivity of 0.84 in the 8–14 µm wave band. What is its reflectivity?",o:["0.84","0.48","0.34","0.16"],a:3,r:"C.12-64",x:"A thick mug is opaque (τ = 0), so ρ = 1 − ε = 1 − 0.84 = 0.16."},
{l:1,n:20,t:"RAD",q:"The temperature of an aluminum bus bar is being measured. You have determined emissivity is 0.15. What is the reflectivity of the bus bar?",o:["0.0","0.15","0.85","1.0"],a:2,r:"A.94; C.12-63",x:"Opaque metal: ρ = 1 − ε = 0.85. Most of what the camera sees from it is reflected background."},
{l:1,n:21,t:"RAD",q:"A perfect thermal mirror would have an emittance equal to:",o:["0.0","0.01","0.5","1.0"],a:0,r:"A.94; C.12-63",x:"A perfect reflector has ρ = 1, so ε = 0. It emits nothing of its own."},
{l:1,n:22,t:"RAD",q:"Thermal infrared radiation occurs at wavelengths:",o:["shorter than X-rays","shorter than visible light","longer than visible light","longer than radio waves"],a:2,r:"A.33; C.12-59",x:"IR lies between visible light (about 0.4–0.75 µm) and microwaves/radio."},
{l:1,n:23,t:"RAD",q:"An opaque graybody surface with an emissivity of 0.04 would be:",o:["transparent to infrared radiation","a fairly good emitter","almost a perfect reflector","almost a perfect emitter"],a:2,r:"A.94; C.12-63",x:"Opaque means τ = 0, so ρ = 1 − 0.04 = 0.96. It is almost a perfect reflector."},
{l:1,n:24,t:"RAD",q:"The radiant energy emitted by an object is a function of what power of its absolute temperature?",o:["first power","second power","third power","fourth power"],a:3,r:"A.89",x:"Stefan–Boltzmann: emitted power ∝ T⁴ (absolute). Doubling absolute temperature gives 16 times the radiant power."},
{l:1,n:25,t:"HT",q:"What are the three modes of heat transfer?",o:["reflected, transmitted, emitted","conductive, convective, radiative","absorption, emission, transmission","temperature, thermal movement, absorbency"],a:1,r:"A.54",x:"Heat moves by conduction, convection and radiation. Option a lists the components of radiosity, not heat transfer modes."},
{l:1,n:26,t:"RAD",q:"A quick and simple technique for improving the emissivity of highly reflective surfaces is to:",o:["use a shorter wavelength infrared camera","apply black electrical tape to the surface","cover the surface with aluminum foil","adhere black thin film polyethelene"],a:1,r:"A.30; C.12-64",x:"Electrical tape has a high, known emissivity (about 0.95). Foil is reflective, and thin polyethylene mostly transmits IR."},
{l:1,n:27,t:"RAD",q:"What can we say for certain about a clear piece of thin plastic?",o:["it is transparent to infrared","it is opaque to infrared","its emissivity is less than 1","its reflectivity is more than 1"],a:2,r:"A.89; C.12-62",x:"Thin plastic transmits and reflects some IR, so its emissivity must be below 1. Whether it is transparent depends on wavelength, and no reflectivity can exceed 1."},
{l:1,n:28,t:"RAD",q:"A large variance of the viewing angle from the normal (90°) to a non-metallic surface of interest ______ the emitted energy sensed.",o:["decreases","increases linearly","increases exponentially","has no effect on"],a:0,r:"A.95",x:"Nonmetals hold a near-constant emissivity out to about 45–60° from normal, then emissivity and sensed energy drop sharply toward grazing angles."},
{l:1,n:29,t:"APP",q:"In an infrared roof moisture survey, what effects cause the areas of roof over wet insulation to be warmer at night than those over dry insulation?",o:["high heat capacity of water and daytime insolation","increase thermal resistance of wet insulation","warmer evening temperatures combined with cooler interior temperatures","lower heat capacity of water and cooler evening temperatures"],a:0,r:"A.57; C.12-68",x:"Solar loading (insolation) charges the wet insulation by day, and water’s high heat capacity keeps it warm after sundown."},
{l:1,n:30,t:"APP",q:"Which of the following is not a typical pattern of an anomalous thermal image associated with wet roof insulation?",o:["circular","amorphous","picture frame","board type"],a:0,r:"H.5",x:"ASTM C1153 lists board-type, amorphous (blotchy) and picture-frame patterns. Circular is not a typical wet-insulation pattern."},
{l:1,n:31,t:"EQ",q:"What does IFOV stand for?",o:["increasing field of view","instantaneous field of view","infringing field of view","image field of view"],a:1,r:"A.281",x:"Instantaneous field of view: the angle subtended by a single detector element, usually stated in milliradians."},
{l:1,n:32,t:"RAD",q:"At what temperature does the emittance of thermal radiation begin?",o:["above −273 K","at 0 °C","above 0 K","above −460 R"],a:2,r:"A.27",x:"Every object above absolute zero (0 K = −273.15 °C = 0 R) emits thermal radiation. Negative kelvin and Rankine values do not exist."},
{l:1,n:33,t:"HT",q:"Why do a block of wood and a piece of steel at the same temperature feel so different when they come into contact with your body?",o:["the thermal conductivity of the steel is greater","the thermal conductivity of the wood is greater","the wood is a much better emitter than the steel","the steel is heavier than the wood"],a:0,r:"A.54",x:"Steel conducts heat away from your skin much faster (k ≈ 50 vs 0.1–0.2 W/m·K for wood), so it feels colder at the same temperature."},
{l:1,n:34,t:"HT",q:"During the summer with clear sunny days, clear nights and a diurnal temperature swing from 32 °C (90 °F) to 10 °C (50 °F), a lake and the surrounding land would probably have the following thermal relationship:",o:["the land would be cooler than the lake at night","the land would be warmer than the lake during the daytime","the land would be warmer than the lake day and night","the land would be cooler earlier in the evening then become warmer by morning"],a:0,r:"A.57",x:"Water’s high heat capacity damps its temperature swing. Land cools faster under a clear night sky and ends up cooler than the lake."},
{l:1,n:35,t:"RAD",q:"The ratio of the radiant emittance of a given body to that of a blackbody is defined as:",o:["radiance","reflectivity","emissivity","transmissivity"],a:2,r:"A.38",x:"Emissivity ε = W(object) / W(blackbody) at the same temperature and wavelength. It ranges from 0 to 1."},
{l:1,n:36,t:"HT",q:"Which of the following has the lowest thermal conductivity?",o:["aluminum","steel","wood","copper"],a:2,r:"A.57",x:"Wood is about 0.1–0.2 W/m·K, compared with roughly 50 (steel), 205 (aluminum) and 400 (copper)."},
{l:1,n:37,t:"EQ",q:"Which of the following camera adjustments is used to optimize thermal contrast of a thermal image?",o:["focus","span","level","range"],a:1,r:"C.12-61",x:"Span sets the temperature width of the display palette. Narrowing it increases thermal contrast; level then centers that window."},
{l:1,n:38,t:"EQ",q:"Which of the following camera adjustments will have an effect on temperature measurement?",o:["focus","span","level","palette"],a:0,r:"C.12-61",x:"Focus changes the radiance actually reaching each detector element. Span, level and palette are display settings only."},
{l:1,n:39,t:"EQ",q:"Which of the following is a commonly used technique to increase contrast in thermal images?",o:["adjust camera to a higher temperature range","increase the span setting of the thermal image","use a gray monochrome palette","change to a multi-division color palette such as a rainbow"],a:3,r:"A.364",x:"Multi-color palettes make small temperature steps visually distinct. Widening the span or using a higher range lowers contrast."},
{l:1,n:40,t:"EQ",q:"Periodically most focal plane array thermal imagers pause the live image and go through an internal routine called what?",o:["non-uniformity correction","internal temperature calibration","thermal temperature correction","temperature uniformity calibration"],a:0,r:"E.45",x:"NUC: a shutter or flag is placed over the array so gain and offset differences between detector elements can be re-equalized."},
{l:1,n:41,t:"EQ",q:"An appropriate thermal span and level setting for imaging a human face in a 22 °C (72 °F) room is:",o:["37 °C (98.6 °F)","27 to 38 °C (80 to 100 °F)","35 to 43 °C (95 to 110 °F)","13 to 22 °C (55 to 72 °F)"],a:1,r:"E.5",x:"Facial skin sits around 30–35 °C. A 27–38 °C window brackets it with room above and below. A single value is not a span."},
// ───────── LEVEL II ─────────
{l:2,n:1,t:"EQ",q:"Infrared cameras measure:",o:["the temperature of a surface","the radiosity of a surface","the radiosity that is absorbed by the detector in an infrared camera","the emittance of a surface"],a:2,r:"A.279",x:"The detector responds only to the radiant power it absorbs: emitted, reflected and transmitted energy, attenuated by the atmosphere and optics. Temperature is calculated from that signal."},
{l:2,n:2,t:"EQ",q:"A camera has an IFOV of 1.9 mRad. What is its theoretical minimum spot size at a distance of 100 cm?",o:["19 cm","0.19 cm","0.019 cm","52 cm"],a:1,r:"A.279",x:"Spot = IFOV × distance = 1.9 × 10⁻³ × 100 cm = 0.19 cm."},
{l:2,n:3,t:"EQ",q:"The slit response function is used to measure:",o:["field of view (FOV)","IFOVmeasurement","NETD","MRTD"],a:1,r:"A.284",x:"The slit response function (SRF) gives the smallest target width that can be measured accurately, which is the IFOVmeasurement. Detection needs fewer pixels than measurement."},
{l:2,n:4,t:"APP",q:"What is the most important factor when inspecting electrical equipment using IR?",o:["thermal sensitivity of the IR camera","safety","image focus","thermal span and level"],a:1,r:"A.299",x:"Energized equipment brings arc-flash and shock hazards. Safety (NFPA 70E, PPE, approach boundaries) comes before image quality."},
{l:2,n:5,t:"RAD",q:"The plant’s main switchgear is to be inspected. The main switchgear has new aluminum busbar. The emissivity of new aluminum busbar is approximately:",o:["1.0","0.90","0.50","0.10"],a:3,r:"A.36",x:"New, unoxidized aluminum is a poor emitter (about 0.05–0.1) and highly reflective. Radiometric readings on it are unreliable."},
{l:2,n:6,t:"APP",q:"What weather conditions are necessary for conducting a thermal infrared roof inspection?",o:["it should have rained within 24 h, inspect during a sunny day","it must not have rained within the last 24 h, inspect during a sunny day","it must have rained within the last 24 h, inspect at night","it must not have rained within the last 24 h, inspect after sundown following a clear sunny day"],a:3,r:"H.4",x:"The surface must be dry so evaporation doesn’t mask patterns. A clear sunny day charges wet insulation, and after sundown the wet areas show warm."},
{l:2,n:7,t:"APP",q:"How should the level and span be set when inspecting overhead electrical bus plugs?",o:["set the camera to auto adjust mode allowing the camera to adjust level and span","set the span wide for the full scene and adjust level to the ambient temperature","set span wide and allow the camera to automatically adjust level","set the span very narrow and adjust the level to the temperature of the bus"],a:3,r:"E.5",x:"A narrow span centered on the bus temperature gives maximum contrast for small differences. Auto mode lets hot or cold background objects dominate the scale."},
{l:2,n:8,t:"APP",q:"A thermal infrared inspection of a building is conducted to determine the presence of insulation. What is the recommended minimum temperature difference between inside and outside?",o:["3 °C (5 °F)","5 °C (9 °F)","10 °C (18 °F)","20 °C (36 °F)"],a:2,r:"G.6",x:"ASTM C1060 recommends at least 10 °C (18 °F) across the envelope so missing insulation produces a usable surface ΔT."},
{l:2,n:9,t:"HT",q:"An object that is not at thermal equilibrium with its surrounding environment is said to be:",o:["at steady state","thermally isolated","thermally transmissive","thermally transient"],a:3,r:"A.698",x:"A transient object is still changing temperature. Steady state means temperatures are constant over time."},
{l:2,n:10,t:"HT",q:"If the amount of insulation in an attic is increased from 10 cm to 20 cm (3.94 in. to 7.87 in.) what effect does it have on the conductive heat transfer?",o:["heat transfer will stay the same","heat transfer will increase by 1/2","heat transfer will be reduced by 1/2","heat transfer will increase by 2 times"],a:2,r:"A.54",x:"Fourier’s law: q = kAΔT/L. Doubling the thickness L halves the conductive heat flow."},
{l:2,n:11,t:"HT",q:"If the temperature difference from inside a house to outside the house decreases from 36 to 9 °C (64.8 to 16.2 °F), what effect does it have on the conductive heat transfer through the walls?",o:["heat transfer will stay the same","heat transfer will increase by four times","heat transfer will be reduced by four times","heat transfer will be reduced by two times"],a:2,r:"A.54",x:"Conductive flow is directly proportional to ΔT. 36 → 9 is a factor of 4, so heat transfer drops to a quarter."},
{l:2,n:12,t:"EQ",q:"When a thermal imaging radiometer is out of calibration and reading temperatures incorrectly, what can be done to bring it back into radiometric calibration?",o:["perform an external non-uniformity correction (NUC)","adjust the calibration with a calibrated blackbody reference source","send the camera back to the manufacturer (or relevant body) for recalibration","adjust the emissivity until the camera reads the correct temperature"],a:2,r:"A.293",x:"Radiometric recalibration needs the manufacturer’s or an accredited lab’s procedure and traceable sources. A NUC only evens out pixel response, and fudging emissivity hides the error."},
{l:2,n:13,t:"APP",q:"The effects of the sun can prevent the accurate inspection of light frame buildings. In accordance with ASTM C 1060, how long should a wall of light frame construction be free from direct solar radiation in order to conduct an infrared inspection of the wall?",o:["1 h","3 h","8 h","12 h"],a:1,r:"G.6",x:"ASTM C1060: light-frame walls should be free of direct solar radiation for at least 3 h before the inspection (heavier masonry walls need longer)."},
{l:2,n:14,t:"HT",q:"A kilogram of each of the following materials is heated to 90 °C (194 °F). Which of the following materials has the most stored thermal energy?",o:["air","aluminum","steel","water"],a:3,r:"A.57",x:"Per kilogram, water’s specific heat (about 4.18 kJ/kg·K) beats aluminum (0.90), air (about 1.0) and steel (0.46)."},
{l:2,n:15,t:"HT",q:"Latent heat energy can be described as:",o:["the energy that creates or breaks the molecular bonds of the phase state of a material","the energy that when added to a material will cause its temperature to increase","the energy released by a material that will cause its temperature to decrease","the energy released by an object that will break the molecular bonds of a material"],a:0,r:"B.15",x:"Latent heat is absorbed or released during a phase change (melting, boiling) with no change in temperature. Option b describes sensible heat."},
{l:2,n:16,t:"RAD",q:"Which of the following surfaces will generally provide the most accurate radiometric temperature measurement?",o:["thin film plastic","oxidized aluminum","glass","water-based paint"],a:3,r:"A.36",x:"Paint is opaque with a high, stable emissivity (about 0.9+), so reflections matter little. Thin plastic transmits, glass is spectrally selective, and oxidized aluminum varies."},
{l:2,n:17,t:"EQ",q:"The instantaneous field of view (IFOV) measurement of a radiometric system is 1.2 mRad. What is the maximum size object this system can accurately measure at a distance of 25 m?",o:["3 m","3 mm","3 cm","20.8 cm"],a:2,r:"A.279",x:"1.2 × 10⁻³ × 25 m = 0.03 m = 3 cm. This is the smallest target that can be measured accurately at that distance."},
{l:2,n:18,t:"APP",q:"The accuracy of the liquid level gage on the 946 353 L (250 000 gal) oil tank is being questioned. Verification of the liquid level is critical but the safety manager is not available to issue a confined entry permit to physically verify the level. It is spring time. Last night was cool and it is now noon and a bright sunny day. What might you consider to determine the oil level?",o:["Assume the liquid level indicator is correct unless definitive proof is submitted otherwise.","Examine the tank with your infrared camera. When you see no level indication between liquid and air it is safe to open the tank access door.","Examine the tank with your infrared camera. The air should be warmer than the liquid and should provide a clear indication of the liquid level.","Examine the tank with your infrared camera. The air will be cooler than the liquid and should provide a clear indication of the liquid level."],a:2,r:"A.290",x:"The low heat capacity vapor space warms quickly under the noon sun, while the large liquid mass lags behind after the cool night. The wall above the liquid line shows warmer."},
{l:2,n:19,t:"APP",q:"How hot does an electrical connection need to be for it to be classified as a serious problem?",o:["1 to 5 °C (33.8 to 41 °F)","5 to 15 °C (41 to 59 °F)","greater than 15 °C (59 °F)","depends on the criticality of equipment to continued safe operation"],a:3,r:"A.533",x:"ΔT tables are guidance only. Severity depends on load, the component’s rating and how critical the equipment is to safe operation."},
{l:2,n:20,t:"RAD",q:"Most imaging infrared radiometers operate in the 3 to 5 or 8 to 12 µm band. This is because of:",o:["atmospheric reflection of solar radiation is adequately attenuated in these two bands","the electromagnetic energy emitted by a target outside these two bands is generally too small to provide usable data","atmospheric absorption within these two bands is small enough to provide minimal impact on radiometry","technological limits of producing detectors with uniform characteristics except for these two wave bands"],a:2,r:"A.80",x:"These are the atmospheric windows. Water vapor and CO₂ absorb strongly between them (for example 5–8 µm)."},
{l:2,n:21,t:"APP",q:"Long wave (8–14 µm) infrared thermography is an excellent tool for inspecting all except which of the following:",o:["drive belts for proper alignment","bearings for signs of impending failure","thin film plastics","the temperature for creating baseline comparison"],a:2,r:"A.289",x:"Thin films are largely transparent in the long-wave band, so the camera sees through them. Measuring them needs a filter at an absorption band such as 3.43 µm."},
{l:2,n:22,t:"RAD",q:"While doing an IR inspection of a heated stainless steel component with several surface holes you notice that one of the holes appears hotter than the others. What could explain this?",o:["that hotter hole is warmer than the other holes","that hole must be reflecting something hotter than the other holes","the hotter hole must have more thermal capacitance","the hotter hole probably is deeper than the other holes"],a:3,r:"A.123",x:"A deeper hole behaves more like a blackbody cavity because internal reflections raise its effective emissivity. It looks hotter at the same temperature."},
{l:2,n:23,t:"ACT",q:"After heating one side of a honeycomb composite with a 4 ply graphite epoxy face sheet, and thermally viewing from the same side, you notice a dark or cool indication that seems to be confined to a group of honeycomb cells. What is the probable cause of this thermal pattern?",o:["there is a disbond between the top sheet and the honeycomb cells","there is a disbond between the bottom face sheet and the honeycomb","there is most likely water or some other liquid in the cells","the honeycomb is most likely crushed"],a:2,r:"A.57, 64",x:"Liquid in the cells soaks heat away from the face sheet (high heat capacity), so those cells look cool. A near-side disbond blocks heat flow and would look hot."},
{l:2,n:24,t:"EQ",q:"From the ground you see a hot spot on a 1 in. (2.54 cm) bolted connector of a transmission line that is approximately 27.4 m (90 ft) away. When you go to measure the temperature, it reads much lower than you think it should be, in fact it appears to be below ambient. What is a probable reason?",o:["your IFOV is not turned on","you are not in focus","you are too far away to accurately measure","the emissivity is probably set incorrectly"],a:2,r:"A.295",x:"The connector is smaller than the measurement spot at 27 m, so the reading averages in the cold sky behind it. Get closer or use a telephoto lens."},
{l:2,n:25,t:"RAD",q:"Thin film plastics, such as polyethylene, are thermally different from most materials because they are:",o:["highly reflective to short-wave thermal radiation","highly absorptive to long-wave thermal radiation","highly transmissive to both mid- and long-wave thermal radiation","opaque to both mid- and long-wave thermal radiation"],a:2,r:"A.291",x:"Thin polyethylene transmits most mid- and long-wave IR except narrow C–H absorption bands (about 3.43, 6.8 and 13.9 µm)."},
{l:2,n:26,t:"APP",q:"Why is infrared thermal imaging often used by building analysts to locate mold growth?",o:["mold is exothermic and appears warmer on the surface","mold is endothermic and absorbs heat from surroundings, thus appearing warm","mold grows on damp surfaces, which appear cooler due to evaporative cooling","mold is endothermic thus cooling the surface"],a:2,r:"D.15",x:"The camera finds the moisture that mold needs, not the mold itself. Damp areas show cool because of evaporative cooling."},
{l:2,n:27,t:"HT",q:"Which of the following materials has the highest thermal capacitance?",o:["steel","brick","water","glass"],a:2,r:"A.57",x:"Water has the highest volumetric heat capacity of the common materials (about 4.18 MJ/m³·K)."},
{l:2,n:28,t:"RAD",q:"Which of the following factors will have the greatest effect on the accuracy of a temperature measurement of a loose connection on a copper alloy bolted plate connection? Assume the copper has an emissivity of 0.28.",o:["estimating the copper has an emissivity of 0.29","not setting relative humidity at 65% rather than the preset 50%","leaving the distance to object set to 3.05 m (10 ft) instead of 4.6 m (15 ft)","not adjusting the background temp from 76.6 °C (170 °F) to actual temperature of 28.3 °C (83 °F)"],a:3,r:"A.289",x:"With ε = 0.28, 72% of the signal is reflected background, so a 48 °C error in reflected temperature dominates. The other errors are small."},
{l:2,n:29,t:"HT",q:"Which of the following lists gives the correct order for the thermal capacitance of the materials? Assume list goes from highest to lowest thermal capacitance.",o:["steel, air, water","air, water, wood","water, steel, air","water, air, steel"],a:2,r:"A.57",x:"Volumetric heat capacity: water ≈ 4.18, steel ≈ 3.6, air ≈ 0.0012 MJ/m³·K."},
{l:2,n:30,t:"EQ",q:"To measure the temperature of heater tubes in a natural gas-fired furnace using a mid-wave sensing system you must:",o:["add the correct filter","set emissivity at 0.05","put a piece of tape on the heater tube","mid-wave systems are not suitable for furnace inspections"],a:0,r:"A.573",x:"A flame filter (about 3.9 µm) puts the camera in a band where the hot combustion gases are nearly transparent, so the tubes behind them can be seen."},
{l:2,n:31,t:"HT",q:"You have found a motor bearing that is 32 °F warmer than normal. Convert this temperature difference (ΔT) to degrees Celsius.",o:["0 °C","17.7 °C","89.6 °C","100 °C"],a:1,r:"A.27",x:"For a difference, use ΔT°C = ΔT°F / 1.8 = 32 / 1.8 ≈ 17.8 °C. Do not subtract 32; that would give 0 °C."},
{l:2,n:32,t:"RAD",q:"Which of the following typically has the greatest influence on taking a radiometric temperature measurement on a low-emissivity object?",o:["background temperature","foreground air temperature","distance to the target","relative humidity"],a:0,r:"A.296",x:"A low-ε surface reflects most of its surroundings, so the reflected (background) temperature setting matters most."},
{l:2,n:33,t:"RAD",q:"Which of the following camera settings has the greatest impact on taking an accurate temperature measurement of an object that actually has an emissivity of 0.87, a background temperature of 23.9 °C (75 °F), relative humidity of 50% and distance to the object is 3.05 m (10 ft)?",o:["relative humidity set at 40% instead of 50%","distance to object set at 5.5 m (18 ft)","emissivity set at 0.72","background temperature set at 21.1 °C (70 °F) instead of 23.9 °C (75 °F)"],a:2,r:"A.296",x:"For a high-ε target, an emissivity error of 0.15 dominates. Small atmospheric and background errors matter little at 3 m."},
{l:2,n:34,t:"APP",q:"While conducting a roof moisture inspection at night after a sunny day, why is it important for the roof surface to be dry?",o:["evaporating water will mask the thermal patterns below the roof surface","a dry roof surface is a better conductor than a wet roof surface","it is better to have a wet roof surface so you can find the leak easier","a dry roof surface will radiate better to the cold sky"],a:0,r:"H.4",x:"Surface water cools by evaporation, which creates false cool areas and hides the warm signature of wet insulation underneath."},
{l:2,n:35,t:"RAD",q:"Which of the following materials emits quite differently in the mid-wave (3.5–5 microns) band than in the long-wave band (8–14 microns)?",o:["plate glass","polished aluminum","painted steel","ceramic"],a:0,r:"D.734",x:"Glass is spectrally selective: it is partly transmissive below about 4.5 µm and opaque with high emissivity in the long-wave band."},
{l:2,n:36,t:"EQ",q:"Using an infrared system with an IFOVmeasurement ratio of 180:1. What is the smallest size object you can accurately measure at a distance of 3 m (3.3 ft)?",o:["16.6 mm (0.65 in.)","18.7 mm (0.74 in.)","50.0 mm (1.97 in.)","166.0 mm (6.54 in.)"],a:0,r:"A.295",x:"3000 mm / 180 ≈ 16.7 mm. (The book’s “3.3 ft” is a misprint; 3 m is 9.8 ft.)"},
{l:2,n:37,t:"EQ",q:"You are looking at an electrical connection 20 m in the air. What IFOV measurement is required to accurately measure the temperature on the 2.54 cm (1 in.) head of a bolt?",o:["0.125 mRad","1.25 mRad","2.5 mRad","25 mRad"],a:1,r:"A.295",x:"IFOVmeas ≤ target / distance = 0.0254 / 20 = 1.27 mrad, so about 1.25 mrad is needed."},
{l:2,n:38,t:"EQ",q:"The IR system being used stores images to videotape. Back in the office you find you’d like to adjust the level and span of an image. How is this accomplished?",o:["digitize the thermal image and adjust the level and span in software","import the video into your manufacturer’s software and adjust level and span","send the video to your camera manufacturer for conversion to 12 bit data","data captured on videotape will not allow the adjustment of level and span"],a:3,r:"A.361; B.12-61",x:"Analog video records only the displayed 8-bit picture, not the radiometric data, so level and span are fixed once recorded."},
{l:2,n:39,t:"EQ",q:"The easiest and cheapest way to improve the spatial resolution of a thermal image is to:",o:["buy a new imager with a detector that has more detector elements","move the camera as close to the target as possible without compromising safety","install a telephoto lens","defocus the lens"],a:1,r:"A.279, 297",x:"Spot size = IFOV × distance, so halving the distance halves the spot and costs nothing. Safe approach distances still apply."},
{l:2,n:40,t:"RAD",q:"Atmospheric attenuation for imaging systems that sense 8–12 microns thermal radiation is:",o:["greater than the attenuation for 3–5 micron radiation","less than the attenuation for 3–5 micron radiation","equal to the attenuation for 3–5 micron radiation","greater than the attenuation for 6–8 micron radiation"],a:1,r:"A.180",x:"The 8–12 µm window has lower atmospheric loss than 3–5 µm. The 6–8 µm region is strongly absorbed by water vapor."},
{l:2,n:41,t:"RAD",q:"When looking at a thermal image, the thermographer is viewing:",o:["thermal patterns representing temperatures on the surface of the target","thermal patterns of objects reflected from the surface of the target","radiance (combined reflected, transmitted and emitted energy) patterns from the surface of the target","radiance (combined reflected, transmitted and emitted energy) patterns of objects reflected from the surface of the object"],a:2,r:"A.89",x:"The image is a radiance map: emitted, reflected and transmitted energy leaving the target surface. It is not a direct temperature picture."},
{l:2,n:42,t:"RAD",q:"As a surface cools, the peak of its radiated infrared energy:",o:["shifts to longer wavelengths","shifts to shorter wavelengths","remains constant if emissivity remains constant","remains constant even if emissivity varies"],a:0,r:"A.90",x:"Wien’s law: λmax = 2898/T (µm·K). Lower T moves the peak to longer wavelengths."},
{l:2,n:43,t:"RAD",q:"The spectral band in which glass transmits infrared radiation most efficiently is the ______ region.",o:["2–4 µm","5–7 µm","6–10 µm","10–15 µm"],a:0,r:"A.294",x:"Ordinary glass transmits to about 4.5 µm and is opaque beyond. That is why short-wave systems can view through glass ports."},
{l:2,n:44,t:"HT",q:"When water freezes:",o:["heat energy is absorbed from the surroundings","the volume decreases and conductivity increases","heat energy is released to the surroundings","the volume increases and conductivity decreases"],a:2,r:"B.15",x:"Freezing releases the latent heat of fusion (about 334 kJ/kg). Volume does increase, but ice conducts heat better than water, so d is wrong."},
{l:2,n:45,t:"HT",q:"The energy content of a gram of steam at 100 °C (212 °F) is much higher than that of a gram of water at 100 °C (212 °F) because of:",o:["a 20 °C (68 °F) temperature difference","the latent heat of vaporization","the additional shortwave thermal radiation","the latent heat of fusion"],a:1,r:"B.15",x:"Same temperature, different phase. Steam holds the latent heat of vaporization (about 2257 kJ/kg)."},
{l:2,n:46,t:"HT",q:"The heat capacity of an object is:",o:["inversely proportional to the material’s specific heat","directly proportional to a material’s specific heat and density","inversely proportional to its density","the ratio of short-wave infrared radiation absorbed by an object to long-wave infrared radiation emitted by the object"],a:1,r:"A.57",x:"Volumetric heat capacity = ρ·cp, density times specific heat."},
{l:2,n:47,t:"RAD",q:"What component of earth’s atmosphere will completely or partially absorb infrared electromagnetic energy in the wave band of 6–8 µm?",o:["water vapor (H₂O)","nitrogen (N₂) and oxygen (O₂) combined","oxygen (O₂)","nitrogen (N₂)"],a:0,r:"A.180",x:"Water vapor absorbs strongly from about 5.5 to 7.5 µm. N₂ and O₂ are essentially IR-inactive."},
{l:2,n:48,t:"APP",q:"Since wind will convectively cool building components reducing thermal differences, it is not advisable to perform building inspections on the windward side when air speeds are in excess of:",o:["6 km/h (3.7 mph)","12 km/h (7.5 mph)","18 km/h (11 mph)","24 km/h (15 mph)"],a:3,r:"G.6",x:"ASTM C1060 advises against inspecting windward walls when wind exceeds about 24 km/h (15 mph)."},
{l:2,n:49,t:"RAD",q:"Which of the following statements regarding infrared emission and absorption is false?",o:["good emitters are good absorbers","poor absorbers are poor emitters","good reflectors are good emitters","poor reflectors are good absorbers"],a:2,r:"A.39",x:"Kirchhoff: ε = α, and for opaque bodies ε = 1 − ρ. Good reflectors are therefore poor emitters."},
{l:2,n:50,t:"RAD",q:"Radiosity is defined as:",o:["the perfect emittance of a blackbody surface","detectivity/transmissivity","a graybody whose emissivity is less than 1","the total radiant exitance leaving a surface (reflectance, emittance and transmittance)"],a:3,r:"A.89; C.12-62",x:"Radiosity is all radiant energy leaving a surface: emitted, reflected and transmitted."},
{l:2,n:51,t:"RAD",q:"Distribution of energy over the wavelength spectrum for a given temperature is best described by which of the following?",o:["Planck’s Law","Stefan-Boltzmann Law","Newton’s Law","Fourier’s Law"],a:0,r:"A.90; C.14-49",x:"Planck’s law gives spectral radiance at each wavelength. Stefan–Boltzmann is its integral over all wavelengths."},
// ───────── LEVEL III ─────────
{l:3,n:1,t:"HT",q:"Energy is measured in units called:",o:["kelvin","joule","watt","Rankine"],a:1,r:"A.25",x:"The joule is the SI unit of energy. The watt is power (J/s); kelvin and Rankine are temperature."},
{l:3,n:2,t:"APP",q:"You are asked to inspect a new paper laminating process, with a long oven and stainless steel rollers, 91.44 cm (36 in.) wide. The paper is laminated with a foil, and only the foil side is visible as it curves around the stainless steel roller at the oven exit. It is important to ensure the foil temperature is uniform at the oven exit for the adhesive to cure properly. What is the best way to ensure the material is cured?",o:["view the nip between the roller and the foil with an infrared radiometric imager","use a thermocouple to measure the moving foil temperature","use reflective radiometry to get an accurate temperature of the foil","increase the emissivity of the foil with black paint"],a:0,r:"A.122",x:"The wedge-shaped nip acts as a cavity. Multiple reflections push its effective emissivity toward 1, even with low-ε foil and steel."},
{l:3,n:3,t:"EQ",q:"When observing an object at 51.85 °C (325 K), which of the following detectors has the greatest detectivity (D*)?",o:["HgCdTe (8 to 12 µm) cooled to −196.15 °C (77 K)","triglycene sulfate (8 to 12 µm) at ambient","InSb (3 to 5 µm) cooled to −196.15 °C (77 K)","PtSi (3 to 5 µm) cooled to −196.15 °C (77 K)"],a:2,r:"A.188",x:"Cooled InSb has the highest peak D* of these. TGS is an uncooled thermal detector, and PtSi has low quantum efficiency."},
{l:3,n:4,t:"EQ",q:"Which device would be most appropriate for measuring the surface temperature of polyethylene film?",o:["a focal plane array radiometer with a InSb detector (3 to 5 µm) cooled to 77 K (−196.15 °C)","a single element scanner with HgCdTe detector (8 to 12 µm) cooled to 77 K (−196.15 °C)","infrared point radiometer filtered to detect 3.45 µm radiation","calibrated bi-metal thermometer"],a:2,r:"A.292",x:"Polyethylene’s C–H absorption band near 3.43 µm makes it opaque, with high ε, at that wavelength. A narrow 3.45 µm filter sees the film itself, not through it."},
{l:3,n:5,t:"CON",q:"Liquid-in-glass thermometers are designed and calibrated for three conditions of use. Which of the following is not a condition of use for a liquid-in-glass thermometer?",o:["suspended immersion","total immersion","partial immersion","complete immersion"],a:0,r:"B.12-35",x:"The three calibrated conditions are total, partial and complete immersion. “Suspended” is not one of them."},
{l:3,n:6,t:"ACT",q:"Which of the following nonuniformity corrections (NUC) will best provide both uniform detector response and correct for offset between the target signal and the detector response over the temperature range of an active pulse IR inspection?",o:["one point external","one point internal","two point external","two point internal"],a:2,r:"E.45",x:"A two-point NUC corrects both gain and offset. Using external reference sources covers the full optical path over the working temperature range."},
{l:3,n:7,t:"RAD",q:"The energy emitted from a piece of metal is measured and the temperature is determined to be 900 °C (1652 °F) assuming a surface emissivity of 0.79. It is later found that the true emissivity is 0.84. What is the closest temperature of the metal from the values listed below?",o:["918 °C (1684 °F)","900 °C (1652 °F)","882 °C (1620 °F)","400 °C (752 °F)"],a:2,r:"D.389",x:"Same signal with a higher ε means a cooler surface. T_true = 1173 K × (0.79/0.84)^¼ ≈ 1155 K ≈ 882 °C."},
{l:3,n:8,t:"RAD",q:"Radiometric imagers of what wavelength should be used for accurate surface temperature measurement of plate glass?",o:["wavelengths less than 1.0 µm","wavelengths less than 4.5 µm","wavelengths greater than 4.5 µm","wavelengths between 1.0 and 2.4 µm"],a:2,r:"A.291",x:"Above about 4.5 µm glass is opaque with high emissivity, so the camera reads the glass surface instead of looking through it."},
{l:3,n:9,t:"RAD",q:"Actual surfaces frequently exhibit variable emissivities over the wavelength spectrum. These surfaces are commonly referred to as:",o:["real bodies","graybodies","blackbodies","white bodies"],a:0,r:"C.385",x:"Real (non-gray) bodies have wavelength-dependent emissivity. A graybody has constant ε < 1 at all wavelengths."},
{l:3,n:10,t:"RAD",q:"The peak spectral radiance from a blackbody with a temperature of 1800 K (1526.85 °C) is:",o:["equal to that of a blackbody at 1800 °R (726.85 °C)","twice that of a blackbody at 900 K (626.85 °C)","less than that of a blackbody at 900 K (626.85 °C)","greater than that of a blackbody at 900 K (626.85 °C)"],a:3,r:"A.54",x:"Peak spectral radiance scales as T⁵, so doubling T gives about 32 times the peak, not twice. 1800 °R is only 1000 K."},
{l:3,n:11,t:"RAD",q:"What is the correct value of the Stefan-Boltzmann constant?",o:["5.67 × 10⁻⁸ W/cm","5.67 × 10⁻¹² W/m²","5.67 × 10⁻⁸ W/m²·K⁴","5.67 × 10⁻⁸ W/cm²·K⁴"],a:2,r:"A.54",x:"σ = 5.67 × 10⁻⁸ W/(m²·K⁴), which is equivalent to 5.67 × 10⁻¹² W/(cm²·K⁴)."},
{l:3,n:12,t:"RAD",q:"Wien’s displacement law for determining the peak wavelength of emitted radiation may be expressed as:",o:["λmax = 2897 / T(K)","λmax = T(K) × 2897","λmax = 2.897 / T(K)","λmax = 289.77 / T(K)"],a:0,r:"A.38",x:"λmax (µm) = 2897 µm·K / T. At 300 K the peak is about 9.7 µm; at 1000 K about 2.9 µm."},
{l:3,n:13,t:"EQ",q:"A change in the electrical resistance of the responsive element in an infrared detector due to temperature changes produced by absorbed, incident infrared radiation describes the:",o:["thermovoltaic effect","photovoltaic effect","pyroelectric effect","bolometric effect"],a:3,r:"A.21",x:"A bolometer, such as a VOx microbolometer, senses heating as a change in resistance. Pyroelectric detectors respond to the rate of temperature change through polarization."},
{l:3,n:14,t:"EQ",q:"The slit response method is the generally accepted method for determining IFOVmeasurement. What percent modulation is required to obtain an accurate temperature?",o:["greater than 90%","less than 90%","50%","none of the above"],a:0,fix:1,r:"A.296",x:"The measurement slit width is where the SRF reaches high modulation (above 90%). 50% is roughly the detection/IFOV point."},
{l:3,n:15,t:"ACT",q:"Thermographic stress analysis is based on which of the following effects that relates dynamic changes in stress to the temperature changes they produce:",o:["thermal conductivity effect","thermal diffusivity effect","thermoelastic effect","thermal gradient effect"],a:2,r:"A.325",x:"Thermoelastic effect: under adiabatic cyclic loading, ΔT = −K·T·Δ(σ₁+σ₂). Tension cools the material slightly and compression warms it."},
{l:3,n:16,t:"ACT",q:"Vibrothermography is a nondestructive test method that involves monitoring the surface of a material with an infrared imager while the material is subjected to:",o:["forced mechanical oscillations","thermal waves","laser excitation","sudden thermal shock"],a:0,r:"A.334",x:"Mechanical vibration (often ultrasonic) causes rubbing at crack faces and delaminations, and the frictional heat is imaged."},
{l:3,n:17,t:"RAD",q:"Thermal radiation is strongly absorbed by water vapor in which of the following wave bands?",o:["3.5 to 5 µm","6 to 8 µm","9 to 10 µm","10 to 12 µm"],a:1,r:"A.180",x:"The 5.5–7.5 µm water vapor band separates the mid-wave and long-wave atmospheric windows."},
{l:3,n:18,t:"EQ",q:"The responsive element of infrared detectors can be divided into what two groups?",o:["reflective detectors and emissive detectors","thermal detectors and photon detectors","static detectors and dynamic detectors","quantitative detectors and qualitative detectors"],a:1,r:"A.274",x:"Thermal detectors (bolometer, pyroelectric, thermopile) respond to heating. Photon detectors (InSb, HgCdTe, PtSi) respond to absorbed photons directly."},
{l:3,n:19,t:"EQ",q:"A good material for making a lens for an infrared imager is:",o:["germanium","graphite epoxy","indium antimonide","glass"],a:0,r:"B.12-58",x:"Germanium transmits well from about 2 to 14 µm. Glass is opaque in the long-wave band, and InSb is a detector material."},
{l:3,n:20,t:"ACT",q:"Heat is applied to the surface of a 0.635 cm (0.25 in.) graphite epoxy laminate. Which of the following statements are true?",o:["when heat is applied evenly over the surface, heat flow will be multidirectional into the part","when heat is applied unevenly over the surface, heat flow will be one dimensional through the part","when heat is applied evenly over the surface, heat flow will be unidirectional through the part until a discontinuity is reached","when heat is applied evenly over the surface, heat flow will be multidirectional through the part until a discontinuity is reached"],a:2,r:"B.54",x:"Uniform heating drives one-dimensional heat flow through the thickness. A discontinuity disturbs it and causes lateral spreading and a surface contrast."},
{l:3,n:21,t:"ACT",q:"You are asked to determine the minimum defect size (surface indication) that can be resolved using a thermal imaging system with an IFOV of 1.5 milliradians. You are following ASTM 2582-07 which requires that nine contiguous pixels are projected within the boundaries of the indication. The minimum focus distance of the thermal imager is 60.96 cm (24 in.). Assuming the surface of the component has an emissivity of 0.94, what is the minimum defect size that can be resolved using the above system?",o:["0.0914 cm (0.036 in.)","0.1829 cm (0.072 in.)","0.2743 cm (0.108 in.)","0.9144 cm (0.36 in.)"],a:2,r:"A.279; I.2",x:"Pixel footprint = 1.5 × 10⁻³ × 60.96 cm = 0.0914 cm. Nine contiguous pixels form a 3 × 3 block: 3 × 0.0914 = 0.2743 cm. The emissivity does not enter the calculation. (The book’s key misprints this answer under item 22.)"},
{l:3,n:22,t:"ACT",q:"How do you know that an active pulse thermographic inspection of a material had sufficient power and inspection time?",o:["using the log plot, look for a break in the straight line indicating heat hitting the back wall","using full power on the flash lamps will always provide sufficient power","the peak contrast plot will indicate all possible indications are identified","there is no way to determine sufficient power and time have been used"],a:0,r:"I.4",x:"On a log–log cooling curve, sound material falls on a straight line (slope −½). A break away from it shows the heat front has reached the back wall, so the full thickness was interrogated."},
{l:3,n:23,t:"RAD",q:"You are inspecting a 1 in. (2.54 cm) thick aluminum panel that has been heated to 50 °C (122 °F). A small surface hole in the panel appears warmer than the smooth surface surrounding it. Why?",o:["the crack or hole has a higher emittance","the surface emits less long wave thermal radiation","the reflectivity of a crack or hole equals 0.9999","radiation is not emitted by aluminum surfaces"],a:0,r:"A.123",x:"Cavity effect: a hole or crack has a higher effective emissivity than the low-ε flat aluminum around it, so it looks warmer at the same temperature."},
{l:3,n:24,t:"ACT",q:"What is the best surface preparation for using quartz lamps to conduct an active thermographic inspection of a composite component?",o:["optically reflective and thermally reflective","optically absorptive and thermally emissive","optically absorptive and thermally neutral","optically reflective and thermally emissive"],a:1,r:"A.122",x:"The surface should absorb the lamp’s visible/near-IR energy efficiently and emit strongly in the camera band. A flat black coating is typical."},
{l:3,n:25,t:"ACT",q:"For the purpose of thermally locating subsurface discontinuities, what is the best method of applying heat to the surface of an 8 ply carbon fiber face sheet to detect a delamination between ply 1 and 2?",o:["quartz lamps","hot air gun","incandescent heat lamp","capacitor driven flash lamps"],a:3,r:"A.376",x:"A very shallow defect appears within milliseconds. Only a short, intense flash pulse gives the time resolution needed; slow heaters wash out the contrast."},
{l:3,n:26,t:"HT",q:"Thermal diffusivity is proportional to:",o:["emissivity times reflectivity","heat capacitance","thermal conductivity divided by heat capacitance","spectral bandwidth divided by responsivity"],a:2,r:"A.57",x:"α = k / (ρ·cp). It sets how fast a thermal front travels, and defect time scales with depth² / α."},
{l:3,n:27,t:"ACT",q:"You suspect that a potential defect indication in a sample may be due to a reflection from the flash lamp. What should you do to determine if the anomaly was a defect or a reflection?",o:["unless the anomaly looks like a reflection of the lamp it must be a defect","rotate the part and test again — if the anomaly moves with the part it is probably a defect","do destructive analysis to see if the indication was a defect","flip the part over and inspect from the back side"],a:1,r:"I.2",x:"A real defect is fixed to the part and moves when the part is rotated. A reflection stays tied to the lamp and camera geometry."},
{l:3,n:28,t:"ACT",q:"When using solvent to clean a test piece for thermal evaluation it is important to:",o:["be sure the solvent is dry for 5 min before the inspection begins","be sure the solvent has fully evaporated","be sure the piece has returned to thermal equilibrium","never use solvents before thermal NDT evaluations"],a:2,r:"B.15",x:"Evaporation cools the surface. Even after the solvent is gone, the part must return to thermal equilibrium or evaporative cooling will show as false indications."},
{l:3,n:29,t:"ACT",q:"According to ASTM E2582-07, as the depth of a flaw increases, the size of the minimum detectable flaw must:",o:["remain the same","increase","decrease","elongate"],a:1,r:"I.2",x:"Lateral diffusion blurs deeper flaws, so they must be larger to be detected, consistent with the radius ≥ depth rule of thumb."},
{l:3,n:30,t:"ACT",q:"According to ASTM E2582-07, the optics and the focal plane should be sufficient so that the projection of nine contiguous pixels onto the sample plane is:",o:["greater than the minimum flaw area","equal to or greater than the minimum flaw area","less than the minimum flaw area","less than or equal to the minimum flaw area"],a:3,r:"I.2",x:"At least a 3 × 3 pixel block must fit inside the smallest flaw of interest, so its footprint must be ≤ the minimum flaw area."},
{l:3,n:31,t:"ACT",q:"According to ASTM E2582-07, the peak contrast time of a subsurface defect depends on which of the following:",o:["depth of the flaw","orientation of the flaw","size of the flaw","depth and size of the flaw"],a:3,r:"I.2",x:"Peak contrast time scales mainly with depth² / α, but lateral diffusion around small flaws shifts it, so both depth and size matter."},
{l:3,n:32,t:"EQ",q:"For high-speed imaging (in excess of 60 frames per second), which of the following detector materials is most appropriate:",o:["PtSi","pyroelectric vidicon","InSb","mercury cadmium telluride"],a:2,r:"A.191, 274",x:"InSb photon detectors combine fast response and high D* for short integration times. Pyroelectric vidicons and microbolometers are slow thermal detectors."},
{l:3,n:33,t:"EQ",q:"A pyroelectric vidicon is a ______ sensor.",o:["photon","thermal","bolometer","thermal/pressure"],a:1,r:"A.188",x:"Pyroelectric detectors are thermal detectors. They respond to the rate of temperature change, so they need chopping or panning."},
{l:3,n:34,t:"EQ",q:"The minimum resolvable temperature difference is a subjective measurement that depends on the:",o:["infrared imaging system’s spatial resolution only","infrared imaging system’s thermal sensitivity and spatial resolution","infrared imaging system’s measurement resolution only","infrared imaging system’s minimum spot size"],a:1,r:"A.177",x:"MRTD is the smallest ΔT an observer can resolve on bar targets of a given spatial frequency, so it combines thermal sensitivity (NETD) and spatial resolution."},
{l:3,n:35,t:"EQ",q:"The spatial resolution of an instrument is related to the:",o:["instantaneous field of view and the working distance","thermal resolution and the system detectivity","spectral band width and the working distance","system responsivity divided by the working distance"],a:0,r:"A.281",x:"Spot size = IFOV × working distance."},
{l:3,n:36,t:"RAD",q:"How does temperature affect the wavelength of infrared peak emittance of an object?",o:["lower temperature objects have shorter peak emittance wavelengths","higher temperature objects have shorter peak emittance wavelengths","temperature variations do not affect the wavelength of emitted radiation","objects experiencing transient temperatures will emit longer waves when they are increasing in temperature and shorter waves when they are cooling"],a:1,r:"F.6",x:"Wien’s law: λmax ∝ 1/T. Hotter objects peak at shorter wavelengths."},
{l:3,n:37,t:"CON",q:"Of the following contact temperature sensors, which is considered to be the most accurate sensor?",o:["RTDs","thermocouples","thermistors","liquid in glass thermometers"],a:0,r:"A.229",x:"Platinum RTDs offer the best accuracy and stability. Standard platinum resistance thermometers define ITS-90 interpolation."},
{l:3,n:38,t:"CON",q:"Which optical property changes due to temperature changes in liquid crystals?",o:["absorptivity","reflectivity","transmissivity","emissivity"],a:1,r:"A.37",x:"Thermochromic liquid crystals change their selective reflection of visible wavelengths with temperature, which is why their color changes."},
{l:3,n:39,t:"ACT",q:"When heat is applied to an inspection surface for active nondestructive evaluation of a material, a thermogram will develop that is a function of the material, the nature of the discontinuity, the heat intensity and:",o:["the time of observation","the wave band of the thermal imager used","the responsivity of the thermal detector","surface roughness of the material"],a:0,r:"A.37",x:"Active thermography is transient, and the contrast from a given defect rises and falls over time. Observation timing is critical."},
{l:3,n:40,t:"ACT",q:"With respect to thermal nondestructive testing, an empirical rule of thumb says that the radius of the smallest detectable discontinuity should be at least ______ its depth under the surface.",o:["one-quarter as large","one-half as large","as large","as large and preferably two or more times as large"],a:3,r:"A.45",x:"The rule of thumb is radius ≥ depth, preferably 2× or more. Contrast falls off rapidly with depth because of lateral diffusion."},
{l:3,n:41,t:"ACT",q:"What is the term used to describe a thermal NDT technique where mechanical vibrations are externally induced into a structure producing heat caused by friction at discontinuities such as cracks and delaminations?",o:["ultrasonic thermography","mechanically induced thermography","frictionally induced thermography","vibrothermography"],a:3,r:"A.44-45",x:"This is vibrothermography (also called sonic or ultrasound-excited thermography): frictional heating at defect faces under vibration."},
{l:3,n:42,t:"RAD",q:"The energy emitted by an object radiates from a surface layer that is how thick?",o:["3 to 4 µm","10 µm","100 µm","200 to 400 µm"],a:0,r:"A.119",x:"For opaque materials, thermal emission comes from a very thin surface layer of only a few micrometers. This is why coatings and surface condition dominate emissivity."},
{l:3,n:43,t:"RAD",q:"What are the two atmospheric gases that absorb transmitted radiation over the wave band of 1 to 15 µm?",o:["ozone and carbon dioxide","oxygen and ozone","water vapor and ozone","water vapor and carbon dioxide"],a:3,r:"A.180",x:"H₂O and CO₂ define the atmospheric windows. CO₂ absorbs strongly near 4.3 µm and 15 µm, and H₂O near 2.7 µm and 6.3 µm."},
{l:3,n:44,t:"EQ",q:"Minimum resolvable temperature difference is a subjective measurement that depends on the infrared imaging system’s:",o:["thermal sensitivity","spatial resolution","detectivity (D*)","thermal sensitivity and spatial resolution"],a:3,r:"A.177",x:"MRTD combines thermal sensitivity and spatial resolution, measured by an observer viewing four-bar targets."},
{l:3,n:45,t:"EQ",q:"You are asked to choose a thermal imaging camera for a critical inspection of an aerospace component. If an anomaly is present it is expected to have a very subtle signal with an MRTD about 75 mK. Expected surface temperature is in the vicinity of 350 K. Which of the following detectors will provide the greatest thermal contrast?",o:["vanadium oxide microbolometer 8 to 12 µm","mercury cadmium telluride 8 to 12 µm","lead selenide 3 to 5 µm","indium antimonide 3.5 to 5 µm"],a:3,r:"A.182, 188",x:"Near 350 K, radiance changes faster with temperature in the mid-wave band (higher relative contrast), and cooled InSb has very high D*. Together they give the greatest thermal contrast."},
{l:3,n:46,t:"RAD",q:"When the radiant emission from a small opening in an isothermal enclosure is examined, the spectral response is found to closely approximate that of a:",o:["spectral body","colored body","blackbody","graybody"],a:2,r:"A.123",x:"A small aperture in an isothermal cavity is the classic blackbody: radiation entering is almost completely absorbed through multiple reflections."},
{l:3,n:47,t:"EQ",q:"Which type of cryogenic cooling system for a photovoltaic type detector is perhaps the best choice for laboratory operation where reliability, quiet operation, and low temperature are required?",o:["Joule-Thomson gas expansion using argon gas","Stirling cooler using helium as coolant","liquid nitrogen in a metal dewar","thermoelectric coolers using the Peltier effect"],a:2,r:"A.182",x:"An LN₂ dewar has no moving parts, is silent and reliable, and reaches 77 K. Refilling is easy in a lab. Stirling coolers vibrate and wear; TE coolers can’t reach 77 K."},
{l:3,n:48,t:"EQ",q:"Which of the following thermal detectors has the highest detectivity (D*)?",o:["InSb","HgCdTe","pyro-electric","microbolometer"],a:0,r:"A.188",x:"Cooled InSb has the highest peak D* listed. (InSb is a photon detector; the book’s “thermal detectors” is loose wording.)"},
{l:3,n:49,t:"RAD",q:"A material that has a flat spectral emissivity curve from 3–12 µm is considered a:",o:["graybody","colored body","blackbody","spectral body"],a:0,r:"A.54, 197, 687",x:"A graybody has constant emissivity below 1 across wavelength. A blackbody has ε = 1 everywhere."},
{l:3,n:50,t:"EQ",q:"An important and critical assumption when using two-color pyrometers is that a smooth curve exists between two variables. What are these two variables?",o:["roughness and color","emissivity and wavelength","emissivity and temperature","spectral translucence and emissivity"],a:1,r:"A.199",x:"Ratio pyrometry assumes emissivity is the same (gray) or varies smoothly between the two wavelengths, so it cancels in the ratio."},
{l:3,n:51,t:"CON",q:"Compared to a thermocouple, an advantage of a resistance temperature detector (RTD) is:",o:["less expensive than a thermocouple","more linear than a thermocouple","wider temperature range than a thermocouple","less stable than a thermocouple"],a:1,r:"A.229",x:"RTDs are more linear, stable and accurate. Thermocouples are cheaper, more rugged and cover a wider range."},
{l:3,n:52,t:"CON",q:"One of the advantages of using thermocouples for temperature measurement over a resistance temperature detector (RTD) is:",o:["thermocouples are more rugged","thermocouples are more stable","thermocouples are more accurate","thermocouples are more linear"],a:0,r:"A.229",x:"Thermocouples are rugged, self-powered, inexpensive and wide-ranging. They give up accuracy, stability and linearity to RTDs."},
{l:3,n:53,t:"CON",q:"One of the advantages of using a resistance temperature detector (RTD) over a thermocouple is RTDs:",o:["have a wide temperature range","are self-powered","are more accurate","are more rugged"],a:2,r:"A.229",x:"RTDs are more accurate. Wide range, self-powering and ruggedness are thermocouple advantages."},
{l:3,n:54,t:"CON",q:"The Seebeck effect is the basis for what temperature measurement device?",o:["liquid-in-glass thermometers","thermocouples","thermistors","resistance temperature detectors"],a:1,r:"A.231",x:"Seebeck effect: a junction of dissimilar metals produces a voltage proportional to the temperature difference between hot and reference junctions."},
{l:3,n:55,t:"CON",q:"You are asked to choose a surface temperature measuring device that must meet the following criteria: wide temperature range; operate in a variety of environments, simple to install, rugged and relatively inexpensive. Which of the following devices meets your requirements the best?",o:["liquid-in-glass thermometers","resistance temperature detectors","thermistors","thermocouples"],a:3,r:"A.235",x:"Wide range, rugged, simple and cheap is the standard thermocouple profile."},
{l:3,n:56,t:"CON",q:"What material is used as the primary element in high-accuracy resistance thermometers?",o:["silver","triglycene sulfate","nickel","platinum"],a:3,r:"A.248",x:"Platinum is chemically stable with a reproducible resistance–temperature curve (Pt100, SPRT). TGS is a pyroelectric detector material."},
{l:3,n:57,t:"RAD",q:"Distinguishing real temperature changes from apparent temperature changes is one of the biggest challenges facing infrared thermographers. Apparent temperature changes can be caused by differences in all of the following except:",o:["emissivity","thermal diffusivity","transmissivity","target geometry"],a:1,r:"A.289",x:"Emissivity, transmissivity and geometry (cavities, viewing angle) change radiance without a real temperature change. Diffusivity affects real heat flow and so real temperatures."},
{l:3,n:58,t:"EQ",q:"Which spectral range will you choose to measure the temperature of an object with a temperature range of 200 to 1000 °C (392 to 1832 °F), inside a heating chamber with a glass viewing port?",o:["2 to 3 µm","4 to 5 µm","6 to 8 µm","8 to 13 µm"],a:0,r:"A.291",x:"Glass transmits only below about 4.5 µm, and a 200–1000 °C target emits strongly at short wavelengths. 2–3 µm also avoids the water-vapor band. (The book’s key misprints this answer under item 59.)"},
{l:3,n:59,t:"EQ",q:"You are asked to measure the temperature of polyethylene at a temperature range 80 to 90 °C (176 to 194 °F). What waveband and with which filter will you choose to make these temperature measurements?",o:["3.4 to 5 µm with a 3.45 µm narrow band pass filter","3.4 to 5 µm with 4.8 µm high pass filter","8 to 13 µm with 7.9 µm low pass filter","8 to 13 µm with a 10.3 µm narrow band pass filter"],a:0,r:"A.292",x:"The 3.43 µm C–H absorption band makes polyethylene opaque and highly emissive there. A mid-wave system with a 3.45 µm narrow band-pass filter sees only the film."},
{l:3,n:60,t:"ACT",q:"When capturing a series of thermal images that record a transient thermal event, such as occurs with pulse heating of a material to detect subsurface anomalies, most of the rapid changes in the thermal evolution curve occur in the time interval immediately following thermal excitation. It is beneficial to view the thermal images using what type of time scale?",o:["linear","logarithmic","exponential","statistical"],a:1,r:"A.363",x:"A log time axis spreads out the fast early changes and compresses the slow late decay. It is also the basis of TSR log–log analysis."},
// ───────── LEVEL III STUDY GUIDE · Kaplan (2001), chapter review questions. s=source, ch=chapter ─────────
{s:"SG",l:3,ch:1,n:1,t:"HT",q:"At a temperature of absolute zero:",o:["hydrogen becomes a liquid.", "all molecular motion ceases.", "salt water is part solid and part liquid.", "fahrenheit and celsius readings are the same."],a:1,r:"F.1",x:"At absolute zero (0 K, −273.15 °C) molecular motion stops. It is the zero point of the Kelvin and Rankine scales."},
{s:"SG",l:3,ch:1,n:2,t:"HT",q:"Conductive heat transfer cannot take place:",o:["within organic materials such as wood.", "between two solid materials in contact.", "between dissimilar metals.", "across a vacuum."],a:3,r:"F.2",x:"Conduction passes energy along through atomic or molecular collisions, so it needs a medium. Across a vacuum only radiation can carry heat."},
{s:"SG",l:3,ch:1,n:3,t:"HT",q:"The only three modes of heat transfer are:",o:["resistive, capacitive and inductive.", "steady state, transient and reversible.", "conduction, convection and radiation.", "conduction, convection and absorption."],a:2,r:"F.1",x:"All heat moves by conduction, convection or radiation. Absorption is something a surface does to incoming radiation, not a transfer mode."},
{s:"SG",l:3,ch:1,n:4,t:"HT",q:"Heat can only flow in the direction from:",o:["hotter objects to colder objects.", "colder objects to hotter objects.", "more dense objects to less dense objects.", "larger objects to smaller objects."],a:0,r:"F.1",x:"Heat flows on its own only from hotter objects to colder ones, until they reach thermal equilibrium."},
{s:"SG",l:3,ch:1,n:5,t:"HT",q:"Thermal resistance is:",o:["analogous to electrical current.", "proportional to the fourth power of emissivity.", "inversely proportional to the rate of heat flow by conduction.", "a measure of material stiffness"],a:2,r:"F.2",x:"Rt = (T₁ − T₂)A / Q. For a given temperature difference, higher thermal resistance means less conductive heat flow."},
{s:"SG",l:3,ch:1,n:6,t:"RAD",q:"The radiation of thermal infrared energy from a target surface:",o:["occurs most efficiently in a vacuum.", "is proportional to the fourth power of the absolute surface temperature.", "is directly proportional to surface emissivity.", "is all of the above."],a:3,fix:1,r:"F.3",x:"Radiation needs no medium and crosses a vacuum most efficiently. By Stefan–Boltzmann, W = εσT⁴, it rises with emissivity and with the fourth power of absolute temperature."},
{s:"SG",l:3,ch:1,n:7,t:"HT",q:"The mode of heat transfer most closely associated with infrared thermography is:",o:["induction.", "radiation.", "convection.", "conduction."],a:1,r:"F.3",x:"An infrared instrument senses the radiant energy leaving a surface, so thermography is tied most closely to radiative heat transfer."},
{s:"SG",l:3,ch:1,n:8,t:"HT",q:"To convert a fahrenheit reading to celsius:",o:["divide by 1.8.", "subtract 32 and divide by 1.8.", "multiply by 1.8 and add 32.", "add 273."],a:1,r:"F.2",x:"°C = 5/9 × (°F − 32), which is the same as subtracting 32 and dividing by 1.8."},
{s:"SG",l:3,ch:1,n:9,t:"RAD",q:"Thermal radiation reaching the surface of an object can be:",o:["absorbed only in the presence of atmosphere.", "reflected and absorbed only in a vacuum.", "transmitted only if the surface is organic.", "absorbed, reflected and transmitted."],a:3,r:"F.5",x:"Incident radiation is split into absorbed, reflected and transmitted parts, and α + ρ + τ = 1."},
