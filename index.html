{s:"SG",l:3,ch:1,n:10,t:"RAD",q:"The following spectral band is included in the infrared spectrum:",o:["0.1 to 5.5 µm.", "0.3 to 10.6 µm.", "0.4 to 20.0 µm.", "0.75 to 100 µm."],a:3,r:"F.4",x:"Infrared runs from just beyond visible red (about 0.75 µm) out to around 1000 µm. Of the bands given, only 0.75 to 100 µm lies inside it."},
{s:"SG",l:3,ch:1,n:11,t:"RAD",q:"Most instruments used in infrared thermography operate somewhere within the:",o:["2 to 14 µm spectral region.", "5 to 10 µm spectral region.", "10 to 20 µm spectral region.", "20 to 100 µm spectral region."],a:0,r:"F.7",x:"Practical instruments work in the 3–5 µm and 8–14 µm atmospheric windows, which both fall within about 2 to 14 µm."},
{s:"SG",l:3,ch:1,n:12,t:"RAD",q:"As a surface cools, the peak of its radiated infrared energy:",o:["shifts to longer wavelengths.", "shifts to shorter wavelengths.", "remains constant if emissivity remains constant.", "remains constant even if emissivity varies."],a:0,r:"F.7",x:"Wien’s displacement law, λmax = b / T, moves the peak to longer wavelengths as a surface cools."},
{s:"SG",l:3,ch:1,n:13,t:"RAD",q:"The peak emitting wavelength of a 300 °C (572 °F) blackbody is approximately:",o:["1.5 µm.", "3 µm.", "10 µm.", "5 µm."],a:3,r:"F.7",x:"λmax = 2897 µm·K / T. At 300 °C, T = 573 K, so the peak is at about 5.1 µm."},
{s:"SG",l:3,ch:1,n:14,t:"RAD",q:"An opaque surface with an emissivity of 0.04 would be:",o:["transparent to infrared radiation.", "a fairly good emitter.", "almost a perfect reflector.", "almost a perfect emitter."],a:2,r:"F.7",x:"For an opaque surface τ = 0, so ρ = 1 − ε = 0.96. It reflects almost all incident energy."},
{s:"SG",l:3,ch:1,n:15,t:"RAD",q:"If a surface has an emissivity of 0.35 and a reflectivity of 0.45, its transmissivity would be:",o:["impossible to determine without additional information.", "0.80.", "0.10.", "0.20."],a:3,r:"F.7",x:"ε + ρ + τ = 1, so τ = 1 − 0.35 − 0.45 = 0.20."},
{s:"SG",l:3,ch:1,n:16,t:"HT",q:"In forced convection, the boundary layer:",o:["increases as the fluid velocity increases.", "remains the same as the fluid velocity increases.", "decreases as the fluid velocity increases.", "increases in proportion to the fourth power of the fluid velocity."],a:2,r:"F.3",x:"Faster flow thins the boundary layer next to the surface, which is why convective heat transfer rises with fluid velocity."},
{s:"SG",l:3,ch:1,n:17,t:"HT",q:"When heating one end of a car key to thaw a frozen automobile door lock, heat transfer from the key to the lock is an example of:",o:["forced convection.", "conductive heat transfer.", "free convection.", "radiative heat transfer."],a:1,r:"F.2",x:"Heat passes from the hot key into the lock through direct solid contact, which is conduction."},
{s:"SG",l:3,ch:1,n:18,t:"RAD",q:"The infrared atmospheric window that transmits infrared radiation best is the:",o:["2.0 to 3.0 µm region.", "3.0 to 6.0 µm region.", "6.0 to 9.0 µm region.", "9.0 to 11.0 µm region."],a:3,r:"F.10",x:"9 to 11 µm sits inside the 8–14 µm atmospheric window, where transmission is highest of the bands listed (Figure 1.10)."},
{s:"SG",l:3,ch:1,n:19,t:"RAD",q:"The spectral band in which glass transmits infrared radiation best is the:",o:["2.0 to 3.0 µm region.", "3.0 to 6.0 µm region.", "6.0 to 9.0 µm region.", "9.0 to 11.0 µm region."],a:0,r:"F.11",x:"Glass transmits well only at short wavelengths, up to about 4.5 µm, and is opaque beyond that (Figure 1.11)."},
{s:"SG",l:3,ch:1,n:20,t:"RAD",q:"Reflectance of infrared radiation by a glass surface is greatest in the:",o:["2.0 to 3.0 µm region.", "3.0 to 6.0 µm region.", "6.0 to 9.0 µm region.", "9.0 to 11.0 µm region."],a:3,r:"F.11",x:"Glass is opaque in the long-wave band, and its reflectance peaks there, around 9–10 µm (Figure 1.11)."},
{s:"SG",l:3,ch:1,n:21,t:"RAD",q:"A diffuse reflecting surface is:",o:["a polished surface that reflects incoming energy at a complementary angle.", "a surface that scatters reflected energy in many directions.", "also called a specular reflecting surface.", "usually transparent to infrared radiation."],a:1,r:"F.5",x:"A rough or textured surface scatters reflected energy in all directions. A smooth (specular) surface reflects at the complementary angle."},
{s:"SG",l:3,ch:1,n:22,t:"RAD",q:"In the 8 to 14 µm spectral region:",o:["the atmosphere absorbs infrared radiant energy almost completely.", "the atmosphere reflects infrared radiant energy almost completely.", "the atmosphere transmits infrared energy very efficiently.", "infrared instruments do not operate very accurately."],a:2,r:"F.7",x:"8 to 14 µm is the long-wave atmospheric window, where the atmosphere transmits infrared energy very efficiently."},
{s:"SG",l:3,ch:2,n:1,t:"RAD",q:"The best way to determine the effective emissivity of a target surface is:",o:["to look it up in a table.", "to calculate it.", "to measure the effective emissivity of the material itself or a similar sample.", "all of the above."],a:2,fix:1,r:"F.19",x:"Tables give only generic values. Measuring the effective emissivity of the material itself, or a similar sample, under real conditions is the reliable method."},
{s:"SG",l:3,ch:2,n:2,t:"RAD",q:"For an opaque graybody target surface, emissivity equals:",o:["1/reflectivity.", "1-reflectivity.", "1.0.", "reflectivity to the fourth power."],a:1,r:"F.19",x:"For an opaque surface τ = 0, so ε + ρ = 1 and ε = 1 − ρ."},
{s:"SG",l:3,ch:2,n:3,t:"RAD",q:"The effective emissivity of a surface is always affected by:",o:["the material, its surface texture and the viewing angle.", "the material, its thermal conductivity and humidity.", "the material, its surface texture and its thermal diffusivity.", "the material, its visible color and its thermal conductivity."],a:0,r:"F.20",x:"Effective emissivity depends on the material, its surface texture and the viewing angle (as well as wavelength and temperature)."},
{s:"SG",l:3,ch:2,n:4,t:"RAD",q:"When measuring the temperature of a nongraybody target:",o:["the viewing angle is not critical.", "always assume an emissivity of 1.0.", "reflections off the near surface may be ignored.", "errors may be caused by hot sources behind the target"],a:3,r:"F.20",x:"A nongraybody may be partly transparent, so hot sources behind it can add transmitted energy and throw off the reading."},
{s:"SG",l:3,ch:2,n:5,t:"RAD",q:"The effective emissivity of a target surface:",o:["can vary at different wavelengths.", "is the same for all wavelengths if the viewing angle is kept constant.", "is always higher at longer wavelengths.", "is always lower at longer wavelengths."],a:0,r:"F.19",x:"Emissivity varies with wavelength. For a nongraybody the value in one band can differ markedly from another."},
{s:"SG",l:3,ch:2,n:6,t:"RAD",q:"Unfinished, unoxidized metal surfaces usually have:",o:["high and uniform emissivities.", "low and uniform emissivities.", "nongraybody characteristics.", "low specular reflectivity."],a:1,r:"F.19",x:"Bare, unoxidized metals are poor emitters with fairly uniform, low emissivity. Oxidation, paint or roughening raises it."},
{s:"SG",l:3,ch:2,n:7,t:"HT",q:"Thermal diffusivity is:",o:["high for metals and low for porous materials.", "the same for all metals.", "low for metals and high for porous materials.", "the same for all porous materials."],a:0,r:"F.20",x:"Diffusivity = k / (ρ·c). Metals conduct heat well and move a thermal front quickly; porous materials do not."},
{s:"SG",l:3,ch:2,n:8,t:"HT",q:"Thermal diffusivity is:",o:["the same as diffuse reflectivity.", "related more to transient heat flow than to steady state heat flow.", "related more to steady state heat flow than to transient heat flow.", "the same as spectral transmittance."],a:1,r:"F.20",x:"Diffusivity sets how fast temperature changes spread through a material, so it governs transient heat flow. Conductivity governs steady state."},
{s:"SG",l:3,ch:2,n:9,t:"HT",q:"Thermal capacitance:",o:["describes the heating of a condenser.", "expresses the heat capacity of a material in a form analogous to electrical capacitance.", "is zero for a blackbody radiator.", "describes the maximum temperature rating of a capacitor."],a:1,r:"F.20",x:"Thermal capacitance is a material’s heat storage, described by analogy with an electrical capacitor storing charge."},
{s:"SG",l:3,ch:2,n:10,t:"RAD",q:"A highly textured surface is said to be diffuse. A smooth surface is said to be:",o:["opaque.", "specular.", "convex.", "transparent."],a:1,r:"F.19",x:"A smooth surface reflects like a mirror, at the complementary angle, so it is called specular."},
{s:"SG",l:3,ch:3,n:1,t:"EQ",q:"The thermal resolution of an instrument is the same as:",o:["the temperature accuracy.", "minimum resolvable temperature difference.", "temperature repeatability.", "the minimum spot size."],a:1,r:"F.40",x:"An imager’s thermal resolution is stated as its minimum resolvable temperature difference (MRTD)."},
{s:"SG",l:3,ch:3,n:2,t:"EQ",q:"The speed of response of an instrument is:",o:["the time constant of the detector.", "one half the time constant of the detector.", "the same as the field repetition rate.", "the time it takes to respond to a step change at the target surface."],a:3,r:"F.36",x:"Speed of response is how long the instrument takes to respond to a step change at the target, usually to 95% of the final value."},
{s:"SG",l:3,ch:3,n:3,t:"EQ",q:"The instantaneous spot size of an instrument is related to the:",o:["instantaneous field of view and the working distance.", "thermal resolution.", "spectral bandwidth and the working distance.", "speed of response and the working distance."],a:0,r:"F.36",x:"Spot size = IFOV × working distance (D = αd)."},
{s:"SG",l:3,ch:3,n:4,t:"EQ",q:"The performance parameters that are important for qualitative thermography are:",o:["absolute accuracy, repeatability and resolution.", "spatial resolution and thermal resolution.", "spatial resolution and absolute accuracy.", "measurement spatial resolution and thermal resolution."],a:1,r:"F.34",x:"Qualitative thermograms show patterns, not temperatures. What counts is seeing small details (spatial resolution) and small differences (thermal resolution)."},
{s:"SG",l:3,ch:3,n:5,t:"EQ",q:"Thermal viewers do not provide:",o:["high resolution thermograms.", "recording capabilities.", "real time scan rates.", "quantitative thermograms"],a:3,r:"F.42",x:"Thermal viewers are qualitative instruments. They show thermal patterns but do not measure temperature."},
{s:"SG",l:3,ch:3,n:6,t:"EQ",q:"The thermal resolution of an instrument tends to:",o:["improve as target temperature increases.", "degrade as target temperature increases.", "remain constant regardless of target temperature.", "improve with increasing working distance."],a:0,r:"F.36",x:"A hotter target emits more energy, so the signal rises above the noise and the instrument resolves smaller temperature differences."},
{s:"SG",l:3,ch:3,n:7,t:"EQ",q:"The 3 to 5 µm spectral region is ideally suited for operation of instruments:",o:["measuring subzero temperature targets.", "measuring targets at extremely long working distances.", "measuring targets warmer than 200 °C (392 °F).", "operating at elevated ambient temperatures."],a:2,r:"F.38",x:"Hotter targets peak at shorter wavelengths, which suits the 3–5 µm band. Long distances and cold targets favor 8–14 µm."},
{s:"SG",l:3,ch:3,n:8,t:"EQ",q:"The total field of view of an imaging instrument determines the:",o:["imaging spatial resolution (IFOV) of the instrument.", "measurement spatial resolution (IFOVmeas) of the instrument.", "image size at the target plane for any given working distance.", "operating spectral range of the instrument."],a:2,r:"F.38",x:"Total field of view is the angular size of the whole image, so it sets the image size at the target plane for a given working distance."},
{s:"SG",l:3,ch:3,n:9,t:"EQ",q:"The frame repetition rate of an imager is defined as the:",o:["number of imaging pixels in a thermogram.", "number of frames selected for image averaging.", "electronic image rate of the display screen.", "number of times every point on the target is scanned in one second."],a:3,r:"F.40",x:"Frame repetition rate is the number of times every point on the target is scanned in one second."},
{s:"SG",l:3,ch:3,n:10,t:"EQ",q:"The purpose of adding an infrared spectral filter to an instrument may be to limit the spectral band:",o:["to only wavelengths longer than a specified wavelength.", "to only wavelengths shorter than a specified wavelength.", "to only wavelengths between two specified wavelengths.", "any of the above."],a:3,fix:1,r:"F.38",x:"Filters can be long-pass, short-pass or band-pass, depending on what the application needs."},
{s:"SG",l:3,ch:3,n:11,t:"EQ",q:"To quickly calculate target spot size, a useful approximation is:",o:["π = 3.1416.", "an instantaneous field of view of 1 degree represents a 60:1 ratio between working distance and spot size.", "there are 2π radians in 360 degrees.", "a 1 °F temperature change is equivalent to a 1.8 °C temperature change."],a:1,r:"F.36",x:"1 degree is about 17.5 mrad, roughly a 60:1 ratio of distance to spot size. That makes it a quick rule of thumb."},
{s:"SG",l:3,ch:3,n:12,t:"EQ",q:"For online process control instruments, important features are:",o:["environmental housings and long term stability.", "ready access to emissivity compensation setting.", "portability and battery life.", "precision sighting."],a:0,r:"F.42",x:"Online sensors run continuously in plant conditions, so protective housings and long-term stability matter most."},
{s:"SG",l:3,ch:3,n:13,t:"EQ",q:"A line scanner can be used to produce a thermogram of a sheet process only when:",o:["emissivity is known.", "the sheet process is moving at a uniform rate.", "the process material is a nongraybody.", "the sheet process is hotter than 200 °C (392 °F)."],a:1,r:"F.42",x:"A line scanner builds the second image dimension from the product’s motion, so the sheet must move at a uniform rate."},
{s:"SG",l:3,ch:3,n:14,t:"EQ",q:"Most quantitative infrared thermal imagers:",o:["are heavier than quantitative imagers and usually require line power.", "can store thermograms on floppy disks in the field.", "require frequent infusions of detector coolant in the field.", "use detectors that operate at room temperature."],a:1,r:"F.44",x:"Quantitative imagers store thermograms and their data in the field (on floppy disk or PCMCIA card when the book was written)."},
{s:"SG",l:3,ch:3,n:15,t:"EQ",q:"Infrared focal plane array imagers:",o:["have no scanning optics.", "cannot be used for quantitative thermography.", "cannot be used for very cool targets.", "cannot operate on rechargeable batteries."],a:0,r:"F.34",x:"A staring focal plane array sees the whole scene at once, so it needs no scanning mirrors."},
{s:"SG",l:3,ch:3,n:16,t:"EQ",q:"Most infrared focal plane array imagers:",o:["use more costly optics than scanning radiometers.", "offer better spatial resolution than scanning radiometers.", "offer better thermal resolution than scanning radiometers.", "offer more diagnostics features than scanning radiometers."],a:1,r:"F.34",x:"With a detector element for every pixel, focal plane arrays give better spatial resolution than scanning radiometers."},
{s:"SG",l:3,ch:3,n:17,t:"EQ",q:"The number of detector elements in an infrared focal plane array imager:",o:["affects the measurement accuracy of the imager.", "affects the thermal resolution of the imager.", "affects the spectral band of the imager.", "affects the spatial resolution of the imager."],a:3,r:"F.34",x:"Each detector element is one pixel, so the element count sets the spatial resolution."},
{s:"SG",l:3,ch:3,n:18,t:"EQ",q:"The fact that all elements in a focal plane array imager are always looking at the target make this kind of imager better suited than scanning imagers for observing:",o:["distant, low temperature targets.", "targets with rapidly changing temperatures.", "targets with low emissivities.", "targets with high emissivities."],a:1,r:"F.34",x:"Every element looks at the target all the time, so fast temperature changes are caught without waiting for a scan cycle."},
{s:"SG",l:3,ch:3,n:19,t:"EQ",q:"For which of the following applications are quantitative thermograms most critical?",o:["Search and rescue.", "Nondestructive material testing.", "Process monitoring and control.", "Security and surveillance."],a:2,r:"F.42",x:"Process monitoring and control acts on measured temperatures, so it needs quantitative data. Search, security and many NDT tasks rely on patterns."},
{s:"SG",l:3,ch:3,n:20,t:"EQ",q:"Infrared thermal detectors:",o:["have a broad, flat spectral response.", "usually require cooling to operate properly.", "have much faster response times than photon detectors.", "have much greater sensitivity than photon detectors."],a:0,r:"F.31",x:"Thermal detectors respond to heating whatever the wavelength, so their spectral response is broad and flat. Photon detectors are faster and more sensitive."},
{s:"SG",l:3,ch:3,n:21,t:"EQ",q:"The characteristics of infrared photodetectors (photon detectors) include:",o:["faster response times than thermal detectors.", "a requirement for cooling to operate properly.", "selective spectral response based on operating temperature.", "all of the above."],a:3,fix:1,r:"F.31",x:"Photon detectors respond faster than thermal detectors, usually need cooling, and have a spectral response set by the material and its operating temperature."},
{s:"SG",l:3,ch:3,n:22,t:"EQ",q:"Filters, lenses and transmitting windows:",o:["are all examples of refractive optical elements.", "have negligible transmission loss in the infrared.", "are all examples of reflective optical elements.", "are not spectrally selective."],a:0,r:"F.32",x:"Filters, lenses and windows all work by passing radiation through them (refraction). Mirrors are the reflective elements."},
{s:"SG",l:3,ch:3,n:23,t:"CON",q:"Resistance temperature detectors and thermistors operate on the same principle, that is:",o:["a predictable change in resistance as a function of temperature.", "the inverse square law.", "the known expansion of dissimilar materials.", "the comparison of target brightness with a calibrated reference."],a:0,r:"F.30",x:"Both rely on a predictable change of electrical resistance with temperature. RTDs use metal elements; thermistors use semiconductors."},
{s:"SG",l:3,ch:3,n:24,t:"EQ",q:"Infrared radiation thermometers are used to measure temperature:",o:["without contacting the target.", "very rapidly.", "without causing a temperature change at the target.", "all of the above."],a:3,fix:1,r:"F.40",x:"Radiation thermometers measure without contact, respond quickly and do not change the target’s temperature."},
{s:"SG",l:3,ch:3,n:25,t:"EQ",q:"Two-color (ratio) pyrometers measure the temperature of a target by:",o:["taking into account the size and distance to the target.", "comparing the radiant energy from the target in two narrow spectral bands.", "incorporating tables of known emissivity.", "calibrating and correcting for the infrared absorption in the measurement path."],a:1,r:"F.42",x:"Ratio pyrometers compare the radiant energy in two narrow bands. If emissivity is the same in both, it cancels out of the ratio."},
{s:"SG",l:3,ch:4,n:1,t:"RAD",q:"Apparent, but not real temperature changes recorded by an infrared instrument can be due to:",o:["emissivity, reflectivity and mass transport differences.", "emissivity, reflectivity and geometric differences.", "thermal capacitance, reflectivity and geometric differences.", "thermal capacitance, mass transport and emittance differences."],a:1,r:"F.51",x:"Apparent changes come from surface and viewing effects: emissivity, reflectivity, transmissivity and geometry. Mass transport and thermal capacitance cause real changes."},
{s:"SG",l:3,ch:4,n:2,t:"HT",q:"Apparent temperature changes recorded by an infrared instrument that are, in fact, real temperature changes can be due to:",o:["emissivity, reflectivity and mass transport differences.", "emissivity, reflectivity and geometric differences.", "thermal capacitance, reflectivity and geometric differences.", "thermal capacitance, mass transport and energy conversion."],a:3,r:"F.51",x:"Real temperature changes come from thermal capacitance, mass transport (fluid flow), phase change, induced heating, energy conversion and direct heat transfer."},
{s:"SG",l:3,ch:4,n:3,t:"RAD",q:"Sun glints cause false indications of temperature changes. In this respect, they are similar to:",o:["solar heating.", "emissivity artifacts.", "resistive heating.", "mass transport."],a:1,r:"F.51",x:"A sun glint is reflected energy, so like an emissivity artifact it changes the apparent temperature, not the real one."},
{s:"SG",l:3,ch:4,n:4,t:"EQ",q:"The lower the temperature of a target to be measured, the more important it is to:",o:["correct for ambient reflections.", "fill the instrument’s measurement spatial resolution with the target.", "use a cooled detector.", "keep batteries fully charged"],a:0,r:"F.61",x:"A cool target emits little, so reflected ambient energy is a large share of the signal and must be corrected for."},
{s:"SG",l:3,ch:4,n:5,t:"EQ",q:"The higher the temperature of a target to be measured, the less important it is to:",o:["fill the instrument’s measurement spatial resolution with the target.", "correct for ambient reflections.", "correct for atmospheric absorption in the measurement path.", "keep batteries fully charged."],a:1,r:"F.61",x:"A hot target emits strongly, so reflected ambient energy is a small share of the signal and matters less."},
{s:"SG",l:3,ch:4,n:6,t:"EQ",q:"Placing a blackbody reference source next to a distant target will usually help correct for:",o:["the effect of atmospheric absorption in the measurement path.", "ambient reflections off the target surface.", "target surface emissivity artifacts.", "point source reflections."],a:0,r:"F.51",x:"A blackbody of known temperature beside the target, viewed through the same path, shows how much the atmosphere attenuates the signal."},
{s:"SG",l:3,ch:4,n:7,t:"EQ",q:"To make an effective infrared temperature measurement, the angle between the target surface and the instrument’s line of sight should be:",o:["always 90 degrees (perpendicular).", "any angle providing the target always fills the measurement spatial resolution of the instrument.", "as close at possible to 90 degrees but not less than 60 degrees.", "anywhere between 30 degrees and 45 degrees."],a:2,r:"F.60",x:"Emissivity holds steady near the normal and falls off toward grazing angles. Aim as close to perpendicular as possible, and no less than 60 degrees."},
{s:"SG",l:3,ch:4,n:8,t:"EQ",q:"If a target does not fill the measurement spatial resolution of the measuring instrument at a convenient measurement distance, it may be necessary to:",o:["use a higher magnification lens or move in closer.", "place a blackbody reference next to the target.", "use the instrument’s electronic zoom feature.", "use more than one isotherm to make the measurement."],a:0,r:"F.60",x:"The target must fill the measurement spot. Move closer or use a higher magnification lens; electronic zoom adds no real resolution."},
{s:"SG",l:3,ch:4,n:9,t:"EQ",q:"Differential thermography can be very useful because it:",o:["tends to minimize the effects of surface emissivity artifacts.", "tends to emphasize only those areas where temperature changes occur.", "helps record changes for thermal trending purposes.", "is all of the above."],a:3,fix:1,r:"F.53",x:"Subtracting a reference image removes static patterns such as emissivity artifacts, highlights only what changed and builds a record for trending."},
{s:"SG",l:3,ch:4,n:10,t:"EQ",q:"When planning a measurement mission, it is important to remember that batteries:",o:["may never reach full charge.", "are about the least reliable element at a thermographer’s disposal.", "lose their charge more rapidly in cold weather.", "are all of the above."],a:3,fix:1,r:"F.62",x:"Batteries may not reach full charge, are among the least reliable items in the kit and lose charge faster in cold weather."},
{s:"SG",l:3,ch:5,n:1,t:"ACT",q:"A major area of infrared nondestructive material testing is based on the fact that:",o:["a good structural bond normalizes emittance artifacts.", "uniform structural continuity provides predictable thermal continuity.", "a structural void is a good thermal bond.", "thermal imagers can be made to measure temperature with great accuracy."],a:1,r:"F.73",x:"Sound material conducts heat uniformly. Voids, disbonds and other discontinuities interrupt heat flow and show as thermal anomalies."},
{s:"SG",l:3,ch:5,n:2,t:"APP",q:"When analyzing a thermographic image, it is usually possible to distinguish between an overload condition and a loose connection because:",o:["a loose connection will appear cool compared to its surroundings.", "a loose connection will appear warmer than the wires on either side.", "an overload will cause a sharper thermal gradient.", "one side of a loose connection will appear much warmer than the other."],a:1,r:"F.67",x:"A loose connection has high resistance and heats locally, so it looks warmer than the conductors on each side. An overload warms the whole conductor."},
{s:"SG",l:3,ch:5,n:3,t:"ACT",q:"The most significant advantage of thermal wave imaging over conventional step stimulation methods of infrared/thermal materials testing is that:",o:["it can find smaller voids.", "it is simpler to implement.", "it can provide better information regarding the depth of a discontinuity.", "it provides images with better spatial resolution."],a:2,r:"F.76",x:"Pulse and thermal wave methods track when the heat signal returns, and that timing relates to the depth of a discontinuity."},
{s:"SG",l:3,ch:5,n:4,t:"APP",q:"The diagnostics involved in thermography of electrical switchgear most frequently involves:",o:["exothermic investigations.", "thermal resistance investigations.", "security investigations.", "fluid flow investigations"],a:0,r:"F.67",x:"Electrical faults generate heat through resistance, which is an exothermic process."},
{s:"SG",l:3,ch:5,n:5,t:"APP",q:"The diagnostics involved in detection of moisture in flat roofs most frequently involve:",o:["exothermic and endothermic investigations.", "thermal resistance and thermal capacitance investigations.", "friction investigations.", "fluid flow investigations."],a:1,r:"F.72",x:"Wet insulation has lower thermal resistance and higher thermal capacitance than dry insulation, and both show on roof surveys."},
{s:"SG",l:3,ch:5,n:6,t:"ACT",q:"In time resolved thermography applied to materials nondestructive testing, the time of the return signal from a void or disbond is most closely related to the:",o:["depth of the discontinuity.", "size of the discontinuity.", "amplitude of the heating pulse.", "spectral characteristics of the heating pulse."],a:0,r:"F.77",x:"In time-resolved thermography, deeper discontinuities appear later, so the return time indicates depth."},
{s:"SG",l:3,ch:5,n:7,t:"APP",q:"In the process monitoring of thin film plastics, successful thermographic measurement is most closely related to:",o:["correcting the instrument for background reflections.", "matching the spectral characteristics of the instrument to those of the target material.", "optimizing the speed of response of the measuring instrument.", "optimizing the spatial resolution of the measuring instrument."],a:1,r:"F.69",x:"Thin plastic films are transparent at most wavelengths. The instrument must work in a band where the film absorbs, such as 3.43 µm for polyethylene."},
{s:"SG",l:3,ch:5,n:8,t:"APP",q:"The unstimulated approach to infrared nondestructive testing can usually be used when evaluating the condition of refractory linings of vessels because:",o:["refractory materials have high effective emissivities.", "refractory materials have high reflectivities in the infrared.", "a strong, uniform source of heat usually exists within the vessel.", "infrared focal plane imagers are available for these applications."],a:2,r:"F.73",x:"The vessel’s own process heat drives steady heat flow through the lining, so no external heating is needed."},
{s:"SG",l:3,ch:5,n:9,t:"APP",q:"Thermography has been successfully applied to some veterinary medicine applications because, in most cases:",o:["healthy animals are hotter than sick animals.", "the emissivity of animal hides is high.", "animals have higher body temperatures than humans.", "infection and trauma usually cause the affected portion of the body to become warmer."],a:3,r:"F.70",x:"Infection, inflammation and trauma raise the temperature of the affected area, which shows as a warm region."},
{s:"SG",l:3,ch:5,n:10,t:"APP",q:"The use of thermography for the detection of moisture infiltration in airframes is made possible by a combination of thermal capacitance differences and:",o:["an endothermic effect that causes the infiltrated portions to appear cooler.", "an exothermic effect that causes the infiltrated portions to appear warmer.", "increased friction between the air flow and the infiltrated sections.", "reduced friction between the air flow and the infiltrated sections."],a:0,r:"F.68",x:"Water that gets into the structure freezes at altitude. Right after landing it is still absorbing heat as it thaws (endothermic), so those areas look cooler."},
{s:"SG",l:3,ch:5,n:11,t:"ACT",q:"Surface thermal patterns can often reveal:",o:["subsurface material defects.", "delaminations within a structure.", "impurities within a material sample.", "all of the above."],a:3,fix:1,r:"F.73",x:"Surface thermal patterns reflect what lies beneath, so subsurface defects, delaminations and impurities can all show up."}
];

</script>
<script>
(function(){
"use strict";
const TOPICS={HT:"Heat transfer & thermodynamics",RAD:"Radiation & emissivity",EQ:"Instruments & detectors",APP:"Field applications",ACT:"Active thermography & ASTM",CON:"Contact temperature sensors"};
const LV={1:"I",2:"II",3:"III"};
const SRC={J:"ASNT Q&A Book J",SG:"Level III Study Guide"};
const SGCH={1:"Principles/Theory",2:"Materials and Their Properties",3:"Thermal Instrumentation",4:"Operating Equipment and Understanding Results",5:"Applications"};
const REFS=[["A","Maldague & Moore (eds.), NDT Handbook 3rd ed., Vol. 3: Infrared and Thermal Testing (ASNT, 2001)"],["B","Incropera & DeWitt, Fundamentals of Heat and Mass Transfer, 5th ed. (2001)"],["C","Guyer, Handbook of Applied Thermal Design (1999)"],["D","Holman, Experimental Methods for Engineers (2001)"],["E","Holst, Testing and Evaluation of Infrared Imaging Systems (1993)"],["F","Kaplan, ASNT Level III Study Guide: Infrared and Thermal Testing (2001)"],["G","ASTM C1060, Thermographic Inspection of Insulation in Envelope Cavities of Frame Buildings"],["H","ASTM C1153, Location of Wet Insulation in Roofing Systems (the book lists it as E 1153)"],["I","ASTM E2582, Infrared Flash Thermography of Composite Panels and Repair Patches"],["J","SNT-TC-1A, Personnel Qualification and Certification in NDT"]];
const KEY="tirq-missed-v1", PREF="tirq-prefs-v1";
const LET="ABCD", BOOK="abcd";
Q.forEach(q=>{q.s=q.s||"J";q.id=q.s==="SG"?"SG"+q.ch+"-"+q.n:q.l+"-"+q.n});
const qLabel=q=>q.s==="SG"?`Study Guide Ch ${q.ch} · Q${q.n}`:`Book J · Level ${LV[q.l]} · Q${q.n}`;
const SORD={J:0,SG:1};
// Identical questions: [kept when both are in a session, hidden twin]. Each appears once; the shown copy is marked as a repeat.
const REPEAT=[["2-42","SG1-12"],["1-23","SG1-14"],["1-17","1-38"],["3-34","3-44"],["3-35","SG3-3"]];
// Same fact asked in different words: both kept, each marked as similar to the other.
const SIMILAR=[["2-43","SG1-19"],["1-25","SG1-3"],["3-36","2-42"],["3-16","3-41"],["3-3","3-48"],["3-4","3-59"],["2-47","3-17"],["1-15","1-29"]];
const twin={}, hidden=new Set(), simOf={};
REPEAT.forEach(([a,b])=>{twin[a]=b;twin[b]=a;hidden.add(b)});
SIMILAR.forEach(([a,b])=>{(simOf[a]=simOf[a]||[]).push(b);(simOf[b]=simOf[b]||[]).push(a)});
function dedupe(list){const ids=new Set(list.map(q=>q.id));return list.filter(q=>!(hidden.has(q.id)&&ids.has(twin[q.id])))}
const UNIQUE=Q.length-REPEAT.length;
const marks=q=>(twin[q.id]?`<span class="rep">Repeat · also ${esc(qLabel(byId[twin[q.id]]))}</span>`:"")+(simOf[q.id]||[]).map(o=>`<span class="sim">Similar to ${esc(qLabel(byId[o]))}</span>`).join("");
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let missed=new Set(load(KEY,[]).filter(id=>byId[id]));
const prefs=Object.assign({levels:[1,2,3],topics:Object.keys(TOPICS),sources:["J","SG"],chapters:[1,2,3,4,5],count:"25",mode:"practice",shufQ:true,shufA:true},load(PREF,{}));

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let S=null, timerId=null;
const fmt=s=>{s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x};

/* ───── setup ───── */
function poolFrom(p){return dedupe(Q.filter(q=>p.sources.includes(q.s)&&(q.s!=="SG"||p.chapters.includes(q.ch))&&p.levels.includes(q.l)&&p.topics.includes(q.t)))}
function setup(){
  stopTimer();
  const cnt=(l)=>Q.filter(q=>q.l===l).length, tc=(t)=>Q.filter(q=>q.t===t).length, sc=(x)=>Q.filter(q=>q.s===x).length, cc=(c)=>Q.filter(q=>q.s==="SG"&&q.ch===c).length;
  app.innerHTML=`
  <header class="hero">
    <div class="eyebrow">ASNT Q&amp;A Book J (2010) · Level III Study Guide (2001)</div>
    <h1>Thermal &amp; Infrared Testing<br>Q&amp;A Review</h1>
    <p>${UNIQUE} unique questions: all ${sc("J")} Level I, II and III questions from the ASNT Q&amp;A book (Book J) and the ${sc("SG")} chapter review questions from Kaplan’s Level III Study Guide. ${REPEAT.length} questions that are the same as another appear only once and are marked as repeats. Each is keyed to its book’s answer, with a short explanation and the source reference.</p>
    <div><div class="iron" aria-hidden="true"></div><div class="scale" aria-hidden="true"><span>LEVEL I · ${cnt(1)}</span><span>LEVEL II · ${cnt(2)}</span><span>LEVEL III · ${cnt(3)}</span></div></div>
  </header>
  <form class="panel" id="setup">
    <div class="grid2">
      <fieldset><legend>Source</legend><div class="chips">
        ${Object.keys(SRC).map(x=>`<label class="chip"><input type="checkbox" id="src${x}" name="src" value="${x}" ${prefs.sources.includes(x)?"checked":""}><span>${SRC[x]} <b>${sc(x)}</b></span></label>`).join("")}
      </div></fieldset>
      <fieldset id="chSet"><legend>Study Guide chapters</legend><div class="chips">
        ${[1,2,3,4,5].map(c=>`<label class="chip"><input type="checkbox" id="ch${c}" name="ch" value="${c}" ${prefs.chapters.includes(c)?"checked":""}><span title="${SGCH[c]}">Ch ${c} <b>${cc(c)}</b></span></label>`).join("")}
      </div></fieldset>
    </div>
    <div class="grid2">
      <fieldset><legend>Level</legend><div class="chips">
        ${[1,2,3].map(l=>`<label class="chip"><input type="checkbox" id="lv${l}" name="lv" value="${l}" ${prefs.levels.includes(l)?"checked":""}><span>Level ${LV[l]} <b>${cnt(l)}</b></span></label>`).join("")}
      </div></fieldset>
      <fieldset><legend>Mode</legend><div class="chips">
        <label class="chip"><input type="radio" id="mdP" name="mode" value="practice" ${prefs.mode==="practice"?"checked":""}><span>Practice · instant feedback</span></label>
        <label class="chip"><input type="radio" id="mdE" name="mode" value="exam" ${prefs.mode==="exam"?"checked":""}><span>Exam · score at end</span></label>
      </div></fieldset>
    </div>
    <fieldset><legend>Topics</legend><div class="chips">
      ${Object.keys(TOPICS).map(t=>`<label class="chip"><input type="checkbox" id="tp${t}" name="tp" value="${t}" ${prefs.topics.includes(t)?"checked":""}><span>${TOPICS[t]} <b>${tc(t)}</b></span></label>`).join("")}
    </div></fieldset>
    <div class="grid2">
      <fieldset><legend>Questions</legend><div class="chips">
        ${["10","25","50","all"].map(c=>`<label class="chip"><input type="radio" id="ct${c}" name="ct" value="${c}" ${prefs.count===c?"checked":""}><span>${c==="all"?"All":c}</span></label>`).join("")}
      </div></fieldset>
      <fieldset><legend>Order</legend><div class="chips">
        <label class="chip"><input type="checkbox" id="shQ" name="shQ" ${prefs.shufQ?"checked":""}><span>Shuffle questions</span></label>
        <label class="chip"><input type="checkbox" id="shA" name="shA" ${prefs.shufA?"checked":""}><span>Shuffle answers</span></label>
      </div></fieldset>
    </div>
    <div class="pool">
      <div><span class="n" id="poolN">0</span> <span class="muted" id="poolTxt">questions in this session</span></div>
      <div class="actions">
        <button type="button" class="btn" id="btnMissed">Retry missed (${missed.size})</button>
        <button type="submit" class="btn primary" id="btnStart">Start</button>
      </div>
    </div>
    <details><summary>Reference key</summary>
      <p class="muted" style="margin:10px 0 0;font-size:13.5px">Each question carries the book’s citation as letter.page, for example A.279 is page 279 of reference A.</p>
      <ul class="refs">${REFS.map(r=>`<li><b>${r[0]}</b>${esc(r[1])}</li>`).join("")}</ul>
    </details>
  </form>
  <p class="foot">Passing marks follow SNT-TC-1A: at least 70% on each examination and an 80% composite. Missed questions are kept in this browser so you can drill them later.</p>`;
  const f=document.getElementById("setup");
  const read=()=>{
    prefs.levels=[...f.querySelectorAll('input[name=lv]:checked')].map(i=>+i.value);
    prefs.topics=[...f.querySelectorAll('input[name=tp]:checked')].map(i=>i.value);
    prefs.sources=[...f.querySelectorAll('input[name=src]:checked')].map(i=>i.value);
    prefs.chapters=[...f.querySelectorAll('input[name=ch]:checked')].map(i=>+i.value);
    f.querySelector('#chSet').disabled=!prefs.sources.includes("SG");
    prefs.mode=f.querySelector('input[name=mode]:checked').value;
    prefs.count=f.querySelector('input[name=ct]:checked').value;
    prefs.shufQ=f.querySelector('#shQ').checked; prefs.shufA=f.querySelector('#shA').checked;
    save(PREF,prefs);
    const pool=poolFrom(prefs); const n=prefs.count==="all"?pool.length:Math.min(+prefs.count,pool.length);
    document.getElementById("poolN").textContent=n;
    document.getElementById("poolTxt").textContent=pool.length?`of ${pool.length} matching questions`:"No questions match. Pick at least one source, level and topic.";
    document.getElementById("btnStart").disabled=!n;
    return {pool,n};
  };
  f.addEventListener("change",read); read();
  document.getElementById("btnMissed").disabled=!missed.size;
  f.addEventListener("submit",e=>{e.preventDefault();const {pool,n}=read();if(!n)return;
    let list=prefs.shufQ?shuffle(pool):pool.slice().sort((a,b)=>SORD[a.s]-SORD[b.s]||a.l-b.l||(a.ch||0)-(b.ch||0)||a.n-b.n);start(list.slice(0,n),prefs.mode)});
  document.getElementById("btnMissed").addEventListener("click",()=>{read();const list=dedupe(Q.filter(q=>missed.has(q.id)));if(list.length)start(prefs.shufQ?shuffle(list):list,prefs.mode,true)});
  window.scrollTo(0,0);
}

/* ───── quiz ───── */
function start(list,mode,isRetry){
  S={mode,isRetry:!!isRetry,i:0,t0:Date.now(),items:list.map(q=>{const order=(prefs.shufA&&!q.fix)?shuffle([0,1,2,3]):[0,1,2,3];return {id:q.id,order,pick:null,locked:false}})};
  startTimer(); render();
}
function startTimer(){stopTimer();timerId=setInterval(()=>{const el=document.getElementById("clock");if(el&&S)el.textContent=fmt((Date.now()-S.t0)/1000)},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function render(){
  const it=S.items[S.i], q=byId[it.id], N=S.items.length, practice=S.mode==="practice";
  const answered=S.items.filter(x=>x.pick!==null).length;
  const doneFrac=(practice?S.items.filter(x=>x.locked).length:answered)/N;
  const showFb=practice&&it.locked;
  const correct=it.pick===q.a;
  app.innerHTML=`
  <div class="bar">
    <div class="left"><span class="lvl">LEVEL ${LV[q.l]}</span><span class="mono">${S.i+1} / ${N}</span>${S.isRetry?'<span class="eyebrow">Missed set</span>':""}</div>
    <div class="left"><span class="mono" id="clock" aria-label="Elapsed time">${fmt((Date.now()-S.t0)/1000)}</span><button class="btn" id="btnEnd">End</button></div>
  </div>
  <div class="track" aria-hidden="true"><div class="fill" style="clip-path:inset(0 ${100-doneFrac*100}% 0 0)"></div><div class="ticks">${N<=60?S.items.map(x=>`<i class="${practice&&x.locked&&x.pick!==byId[x.id].a?"miss":""}"></i>`).join(""):""}</div></div>
  <section class="panel" aria-live="polite">
    <div class="meta"><span>${q.s==="SG"?`Study Guide Ch ${q.ch} · Q${q.n}`:`Book J · Q${q.n}`}</span><span>Ref ${esc(q.r)}</span><span>${TOPICS[q.t]}</span>${marks(q)}</div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" role="group" aria-label="Answer options">
      ${it.order.map((oi,pos)=>{
        let cls="opt";
        if(showFb){if(oi===q.a)cls+=" ok";else if(oi===it.pick)cls+=" no"}
        else if(it.pick===oi)cls+=" sel";
        return `<button class="${cls}" data-oi="${oi}" ${showFb?"disabled":""} aria-pressed="${it.pick===oi}"><span class="k">${LET[pos]}</span><span>${esc(q.o[oi])}</span></button>`}).join("")}
    </div>
    ${showFb?`<div class="explain ${correct?"":"wrong"}"><h3>${correct?"Correct.":`Not quite. Answer: ${LET[it.order.indexOf(q.a)]}`}</h3><p>${esc(q.x)}</p><p class="hint">Book answer ${BOOK[q.a]} · ${esc(q.r)}</p></div>`:""}
  </section>
  <div class="nav">
    <button class="btn" id="btnPrev" ${S.i===0?"disabled":""}>Back</button>
    <span class="hint">Keys 1–4 or A–D · Enter to continue</span>
    <button class="btn primary" id="btnNext" ${practice&&!it.locked?"disabled":""}>${S.i===N-1?"Finish":"Next"}</button>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.oi)));
  document.getElementById("btnNext").addEventListener("click",next);
  document.getElementById("btnPrev").addEventListener("click",()=>{if(S.i>0){S.i--;render()}});
  document.getElementById("btnEnd").addEventListener("click",confirmEnd);
}
function choose(oi){
  const it=S.items[S.i]; if(it.locked)return;
  it.pick=oi;
  if(S.mode==="practice"){it.locked=true;track(it)}
  render();
  if(S.mode==="practice"){const n=document.getElementById("btnNext");n&&n.focus({preventScroll:true})}
}
function track(it){const q=byId[it.id];if(it.pick===q.a)missed.delete(it.id);else missed.add(it.id);save(KEY,[...missed])}
function next(){
  const it=S.items[S.i];
  if(S.mode==="practice"&&!it.locked)return;
  if(S.i<S.items.length-1){S.i++;render();window.scrollTo(0,0)}else finish();
}
function confirmEnd(){
  const left=S.items.filter(x=>x.pick===null).length;
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT"><h2 id="mT">End this session?</h2><p class="muted">${left?`${left} unanswered question${left>1?"s":""} will be scored as wrong.`:"All questions are answered."}</p><div class="actions"><button class="btn primary" id="mYes">Score now</button><button class="btn" id="mNo">Keep going</button><button class="btn" id="mQuit">Discard</button></div></div>`;
  document.body.appendChild(sc);
  const close=()=>sc.remove();
  sc.querySelector("#mYes").onclick=()=>{close();finish()};
  sc.querySelector("#mNo").onclick=close;
  sc.querySelector("#mQuit").onclick=()=>{close();S=null;setup()};
  sc.addEventListener("click",e=>{if(e.target===sc)close()});
  sc.querySelector("#mNo").focus();
}

/* ───── results ───── */
function finish(){
  stopTimer();
  const secs=(Date.now()-S.t0)/1000;
  if(S.mode==="exam")S.items.forEach(it=>{if(it.pick!==null)track(it)});
  const items=S.items.map(it=>({...it,q:byId[it.id],ok:it.pick===byId[it.id].a}));
  const N=items.length, C=items.filter(x=>x.ok).length, pct=Math.round(C/N*100);
  const pass=pct>=70;
  const grp=(key,labels)=>{const m={};items.forEach(x=>{const k=x.q[key];(m[k]=m[k]||{n:0,c:0}).n++;if(x.ok)m[k].c++});return Object.keys(labels).filter(k=>m[k]).map(k=>({label:labels[k],...m[k]}))};
  const lv=grp("l",{1:"Level I",2:"Level II",3:"Level III"}), tp=grp("t",TOPICS), sr=grp("s",SRC);
  const rowH=r=>`<div class="row"><span>${esc(r.label)}</span><span class="t"><i style="width:${r.c/r.n*100}%"></i></span><span class="v">${r.c}/${r.n}</span></div>`;
  const wrongs=items.filter(x=>!x.ok);
  app.innerHTML=`
  <header class="hero"><div class="eyebrow">${S.mode==="exam"?"Exam":"Practice"} result · ${fmt(secs)} elapsed · ${Math.round(secs/N)} s per question</div></header>
  <section class="panel">
    <div class="score">
      <div class="big">${pct}<small>%</small></div>
      <div style="display:grid;gap:8px;min-width:0">
        <div><span class="verdict ${pass?"pass":"fail"}">${pass?"MEETS 70% MINIMUM":"BELOW 70% MINIMUM"}</span></div>
        <div class="muted">${C} of ${N} correct${pct>=80?" · above the 80% composite":""}</div>
        <div class="gauge" aria-hidden="true"><div class="iron"></div><span class="mark" style="left:70%"></span><span class="mark" style="left:80%"></span><span class="needle" style="left:calc(${pct}% - 1px)"></span></div>
        <div class="scale" aria-hidden="true"><span>0</span><span style="margin-left:auto;margin-right:3%">70 · 80</span><span>100</span></div>
      </div>
    </div>
  </section>
  ${sr.length>1?`<section class="panel"><h2>By source</h2><div class="rows">${sr.map(rowH).join("")}</div></section>`:""}
  <section class="panel"><h2>By level</h2><div class="rows">${lv.map(rowH).join("")}</div></section>
  <section class="panel"><h2>By topic</h2><div class="rows">${tp.map(rowH).join("")}</div></section>
  <div class="actions">
    <button class="btn primary" id="rMiss" ${wrongs.length?"":"disabled"}>Retry these ${wrongs.length} missed</button>
    <button class="btn" id="rNew">New session</button>
  </div>
  <section class="panel">
    <div class="bar"><h2>Review</h2><div class="chips">
      <label class="chip"><input type="radio" id="fW" name="rf" value="w" ${wrongs.length?"checked":""}><span>Missed <b>${wrongs.length}</b></span></label>
      <label class="chip"><input type="radio" id="fA" name="rf" value="a" ${wrongs.length?"":"checked"}><span>All <b>${N}</b></span></label>
    </div></div>
    <div class="review" id="rv"></div>
  </section>`;
  const draw=(only)=>{
    const list=only?wrongs:items;
    document.getElementById("rv").innerHTML=list.length?list.map(x=>{const q=x.q;
      const tag=x.pick===null?'<span class="tag skip">UNANSWERED</span>':x.ok?'<span class="tag ok">CORRECT</span>':'<span class="tag no">MISSED</span>';
      return `<article class="rv"><div class="meta">${tag}<span>${qLabel(q)}</span><span>${esc(q.r)}</span>${marks(q)}</div>
      <p class="q">${esc(q.q)}</p>
      <div class="a">${x.pick!==null&&!x.ok?`<span class="y">Your answer: ${BOOK[x.pick]}. ${esc(q.o[x.pick])}</span>`:""}<span class="c">Correct: ${BOOK[q.a]}. ${esc(q.o[q.a])}</span></div>
      <p class="x">${esc(q.x)}</p></article>`}).join(""):'<p class="muted" style="margin:0">Nothing missed in this session.</p>';
  };
  draw(!!wrongs.length);
  app.querySelectorAll('input[name=rf]').forEach(r=>r.addEventListener("change",()=>draw(r.value==="w"&&r.checked)));
  document.getElementById("rMiss").onclick=()=>start(prefs.shufQ?shuffle(wrongs.map(x=>x.q)):wrongs.map(x=>x.q),S.mode,true);
  document.getElementById("rNew").onclick=()=>{S=null;setup()};
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!S||document.querySelector(".scrim")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(!document.querySelector(".opts"))return;
  const k=e.key.toLowerCase(); const map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  if(k in map){const it=S.items[S.i];choose(it.order[map[k]]);e.preventDefault()}
  else if(k==="enter"){const t=document.activeElement;if(t&&t.tagName==="BUTTON")return;next();e.preventDefault()}
  else if(k==="arrowleft"&&S.i>0){S.i--;render()}
});

setup();
})();
</script>
</body>
</html>
